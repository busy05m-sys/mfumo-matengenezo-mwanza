  if(!regNo || !owner){ toast("Jaza taarifa muhimu (*)","red"); return; }
  const g = id => document.getElementById(id).value;
  DB.roadworthiness.push({
    id:uid('rwr'), regNo, owner,
    yearPurchase:g('rw_yearPurchase'), purchasePrice:g('rw_purchasePrice'), capacity:g('rw_capacity'),
    accidents:g('rw_accidents'), hrsKm:g('rw_hrsKm'), minor:g('rw_minor'), yearManuf:g('rw_yearManuf'), major:g('rw_major'),
    engineNo:g('rw_engineNo'), chassisNo:g('rw_chassisNo'), location:g('rw_location'), ownerName:g('rw_ownerName'),
    roadLicense:g('rw_roadLicense'), insurance:g('rw_insurance'), exterior:g('rw_exterior'), interior:g('rw_interior'),
    tyre:g('rw_tyre'), headlamps:g('rw_headlamps'), indicators:g('rw_indicators'), brakeLights:g('rw_brakeLights'),
    wipers:g('rw_wipers'), horn:g('rw_horn'), steering:g('rw_steering'), brakeSystem:g('rw_brakeSystem'),
    starting:g('rw_starting'), drivability:g('rw_drivability'), suspension:g('rw_suspension'), transmission:g('rw_transmission'),
    clutch:g('rw_clutch'), otherFindings:g('rw_otherFindings'),
    remarks:g('rw_remarks'), inspectedBy:g('rw_inspectedBy'), inspectedDate:g('rw_inspectedDate'),
    approvedBy:g('rw_approvedBy'), approvedDate:g('rw_approvedDate'),
    date: g('rw_inspectedDate') || todayISO(), createdAt:nowTime()

const TT_THEORY_MAX = [10,20,10,10];
const TT_THEORY_LABELS = ["Punctuality in understanding / asking questions","Correctness of Answers (Relevant)","Awareness of Vehicles and Road Signs","Experience in Driving Public Vehicles / Plant"];

function ttGradeResult(total){
  if(total >= 75) return {label:"Qualified P/Driver", cls:"green"};
  if(total >= 50) return {label:"Satisfactory Driver Test (P-)", cls:"amber"};
  return {label:"Failed Driver Test (F-)", cls:"red"};
}

}

          <div style="text-align:right;"><div id="tt_gradeTotalDisplay" style="font-size:26px;font-weight:800;font-family:'Sora';color:var(--navy);">0%</div><div id="tt_resultBadge"></div></div>

  `);
  recalcTradeTest();
}
function recalcTradeTest(){
  let totalA = 0;
  TT_THEORY_MAX.forEach((max,i)=>{ const v = Math.min(Number(document.getElementById('tt_theory'+i).value)||0, max); totalA += v; });
  let totalB = 0;
  TT_PRACTICAL_MAX.forEach((max,i)=>{ const v = Math.min(Number(document.getElementById('tt_practical'+i).value)||0, max); totalB += v; });
  document.getElementById('tt_totalADisplay').textContent = totalA;
  document.getElementById('tt_totalBDisplay').textContent = totalB;
  const total = totalA + totalB;
  document.getElementById('tt_gradeTotalDisplay').textContent = total + '%';
  const g = ttGradeResult(total);
  document.getElementById('tt_resultBadge').innerHTML = `<span class="badge ${g.cls} dot">${g.label}</span>`;
}
function saveTradeTest(){
  const licenceNo = document.getElementById('tt_licenceNo').value.trim();
  const fullName = document.getElementById('tt_fullName').value.trim();
  if(!licenceNo || !fullName){ toast("Jaza Licence No na Full Name","red"); return; }
  const theory = TT_THEORY_MAX.map((max,i)=>Math.min(Number(document.getElementById('tt_theory'+i).value)||0, max));
  const practical = TT_PRACTICAL_MAX.map((max,i)=>Math.min(Number(document.getElementById('tt_practical'+i).value)||0, max));
  const totalA = theory.reduce((a,b)=>a+b,0);
  const totalB = practical.reduce((a,b)=>a+b,0);
  DB.tradeTests.push({
    id:uid('tt'), certNo:document.getElementById('tt_certNo').value.trim(), licenceNo, fullName,
    licenceClasses:document.getElementById('tt_licenceClasses').value.trim(), licenceExp:document.getElementById('tt_licenceExp').value,
    theory, practical, totalA, totalB, gradeTotal: totalA+totalB,
    conductedBy:document.getElementById('tt_conductedBy').value.trim(), approvedBy:document.getElementById('tt_approvedBy').value.trim(),
    date:document.getElementById('tt_date').value||todayISO(), fee:Number(document.getElementById('tt_fee').value)||0,
    createdAt:nowTime()
  });
  saveDB(); closeModal(); toast("Matokeo ya Trade Test yamehifadhiwa","green");
  renderTradeTest(document.getElementById('view_tradetest'));
}

function triggerRecoveryMerge(){ document.getElementById('recoveryMergeFile').click(); }
function recoveryMergeImport(evt){
  const file = evt.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const parsed = JSON.parse(e.target.result);
      const migrated = migrateDB((()=>{ const d=defaultDB(); for(const k in d){ if(parsed[k]!==undefined) d[k]=parsed[k]; } return d; })());
      mergeImportedDB(migrated);
      alert("Akaunti (na taarifa nyingine mpya) zimeongezwa. Sasa jaribu kuingia tena.");
      renderLoginScreen();
    }catch(err){ alert("Faili si sahihi: "+err.message); }
  };
  reader.readAsText(file);
}
function enterEmergencyMode(){
  if(!confirm("Utaingia kwa muda bila akaunti, ukiwa na ruhusa zote, kwa kikao hiki tu (si cha kudumu). Endelea?")) return;
  emergencyMode = true;
  currentUser = { id:'__emergency__', username:'dharura', fullName:'Hali ya Dharura', role:'Msimamizi (Muda)', isAdmin:true, allowedModules: ALL_MODULES.map(m=>m.id), active:true };
  startApp();
}
function resetAllAccounts(){
  if(!confirm("Una uhakika? Hii itafuta AKAUNTI ZOTE kwenye kompyuta hii (si magari/mifumo/malipo). Huwezi kurudisha nyuma.")) return;
  DB.users = [];
  saveDB();
  localStorage.removeItem('temesa_current_user_id');
  renderSetupScreen();
}
function showAuthError(msg){
  const el = document.getElementById('authError');
  el.textContent = msg; el.classList.add('show');
}
async function createFirstAdmin(){
  const fullName = document.getElementById('su_fullName').value.trim();
  const username = document.getElementById('su_username').value.trim();
  const pw = document.getElementById('su_password').value;
  const pw2 = document.getElementById('su_password2').value;
  if(!fullName || !username || !pw){ showAuthError("Jaza taarifa zote"); return; }
  if(pw.length<4){ showAuthError("Nenosiri liwe angalau herufi/namba 4"); return; }
  if(pw!==pw2){ showAuthError("Manenosiri hayafanani"); return; }
  const passwordHash = await hashPassword(pw);
  const user = {id:uid('usr'), username, passwordHash, fullName, role:'Msimamizi (Full Access)',
    allowedModules: ALL_MODULES.map(m=>m.id), isAdmin:true, active:true, createdAt:nowTime()};
  DB.users.push(user); saveDB();
  currentUser = user;
  localStorage.setItem('temesa_current_user_id', user.id);
  startApp();
}
async function attemptLogin(){
  const username = document.getElementById('li_username').value.trim();
  const pw = document.getElementById('li_password').value;
  const user = DB.users.find(u=>u.username.toLowerCase()===username.toLowerCase());
  if(!user || user.active===false){ showAuthError("Jina la mtumiaji halipo au akaunti imezimwa"); return; }
  const ok = await passwordMatches(pw, user.passwordHash);
  if(!ok){ showAuthError("Nenosiri sio sahihi. Ukiendelea kupata tatizo hili hata ukiwa na uhakika nenosiri ni sahihi, bofya 'Una tatizo la kuingia?' chini."); return; }
  currentUser = user;
  localStorage.setItem('temesa_current_user_id', user.id);
  startApp();
}
function logout(){
  if(!confirm("Una uhakika unataka kutoka?")) return;
  currentUser = null;
  emergencyMode = false;
  localStorage.removeItem('temesa_current_user_id');
  document.getElementById('app').style.display='none';
  renderLoginScreen();
}
function initAuth(){
  if(DB.users.length===0){ renderSetupScreen(); return; }
  const savedId = localStorage.getItem('temesa_current_user_id');
  const savedUser = savedId ? DB.users.find(u=>u.id===savedId && u.active!==false) : null;
  if(savedUser){ currentUser = savedUser; startApp(); }
  else { renderLoginScreen(); }
}
function startApp(){
  document.getElementById('authScreen').style.display='none';
  document.getElementById('authScreen').innerHTML = '';
  document.getElementById('app').style.display='flex';
  buildSidebar();
  buildTopbarActions();
  const firstAllowed = currentUser.isAdmin ? 'dashboard' : (currentUser.allowedModules[0] || null);
  if(!firstAllowed){ toast("Akaunti hii haina ruhusa ya kuona sehemu yoyote. Wasiliana na Msimamizi.","red"); return; }
  go(firstAllowed);
  (async function initPersistence(){
    try{ if(navigator.storage && navigator.storage.persist) await navigator.storage.persist(); }catch(e){}
    await trySilentReconnect();
    updateSyncBadge();
    checkForDataRecovery();
    maybeShowDailyEmailReminder();
  })();
}

        </div>
        <div class="field" style="flex-direction:row;align-items:center;gap:8px;">

      ${u ? `<div class="field" style="flex-direction:row;align-items:center;gap:8px;margin-top:8px;">
        <input type="checkbox" id="uf_active" style="width:auto;" ${u.active!==false?'checked':''}>

}
function applyRolePreset(key){
  const preset = ROLE_PRESETS[key];
  if(!preset) return;
  document.querySelectorAll('#uf_modules input[type=checkbox]').forEach(cb=>{ cb.checked = preset.modules.includes(cb.value); });
  document.getElementById('uf_isAdmin').checked = preset.isAdmin;
}
function toggleAdminModules(isAdmin){
  if(isAdmin){
    document.querySelectorAll('#uf_modules input[type=checkbox]').forEach(cb=>cb.checked=true);
    document.getElementById('uf_canEdit').checked = true;
    document.getElementById('uf_canDelete').checked = true;
  }
}
async function saveUser(id){
  if(id && !requireEdit()) return;
  const fullName = document.getElementById('uf_fullName').value.trim();
  const username = document.getElementById('uf_username').value.trim();
  const pw = document.getElementById('uf_password').value;
  const err = document.getElementById('userFormError');
  err.classList.remove('show');
  if(!fullName || !username){ err.textContent="Jaza jina na username"; err.classList.add('show'); return; }
  const dup = DB.users.find(u=>u.username.toLowerCase()===username.toLowerCase() && u.id!==id);
  if(dup){ err.textContent="Username hii tayari inatumika na mtumiaji mwingine"; err.classList.add('show'); return; }
  if(!id && !pw){ err.textContent="Weka nenosiri kwa mtumiaji mpya"; err.classList.add('show'); return; }
  const allowedModules = [...document.querySelectorAll('#uf_modules input:checked')].map(i=>i.value);
  const isAdmin = document.getElementById('uf_isAdmin').checked;
  const canEdit = isAdmin || document.getElementById('uf_canEdit').checked;
  const canDelete = isAdmin || document.getElementById('uf_canDelete').checked;
  const role = document.getElementById('uf_rolePreset').value;
  const data = { fullName, username, role, allowedModules, isAdmin, canEdit, canDelete };
  if(id){
    const u = DB.users.find(x=>x.id===id);
    Object.assign(u, data);
    if(pw) u.passwordHash = await hashPassword(pw);
    const activeBox = document.getElementById('uf_active');
    if(activeBox) u.active = activeBox.checked;
  } else {
    const passwordHash = await hashPassword(pw);
    DB.users.push({id:uid('usr'), ...data, passwordHash, active:true, createdAt:nowTime()});
  }
  saveDB(); closeModal(); toast("Taarifa za mtumiaji zimehifadhiwa","green");
  renderUsers(document.getElementById('view_users'));
  if(id===currentUser?.id){ buildSidebar(); } // refresh own nav if self-edited
}
function deleteUser(id){
  if(!requireDelete()) return;
  if(!confirm("Una uhakika unataka kufuta mtumiaji huyu?")) return;
  DB.users = DB.users.filter(u=>u.id!==id);
  saveDB(); toast("Mtumiaji amefutwa","green");
  renderUsers(document.getElementById('view_users'));
}

  const recipientEmail = document.getElementById('em_recipient').value.trim() || 'kisejacl@gmail.com';
  saveEmailSettings({senderEmail, recipientEmail});
  exportBackup(false);
  const subject = encodeURIComponent(`TEMESA Mwanza — Taarifa za Mfumo — ${fmtDate(todayISO())}`);
  const bodyLines = [
    `Habari,`, ``,
    `Tafadhali pata taarifa/nakala ya mfumo wa TEMESA Mwanza iliyoambatanishwa.`,
    senderEmail ? `Imetumwa na: ${senderEmail}` : ``,
    `Tarehe: ${fmtDate(todayISO())}`, ``,
    `KUMBUKA KWA MPOKEAJI: faili lililoambatanishwa (temesa_mwanza_backup_....json) linaweza kupakiwa kwenye mfumo kwa kubofya "🔀 Unganisha Nakala" ili kuunganisha na taarifa zilizopo bila kupoteza chochote.`, ``,
    `Asante.`

/** If changes were made today but no email/backup was sent today, gently remind once per day. */
function maybeShowDailyEmailReminder(){
  const today = todayISO();
  const updatedToday = DB.meta && DB.meta.updatedAt && DB.meta.updatedAt.slice(0,10)===today;
  const lastSent = localStorage.getItem('temesa_last_email_sent');
  const dismissedToday = localStorage.getItem('temesa_email_reminder_dismissed') === today;
  if(updatedToday && lastSent!==today && !dismissedToday){
    setTimeout(()=>{
      openModal(`
        <div class="modal-head"><h3>📧 Kumbusho la Taarifa ya Leo</h3><button class="modal-x" onclick="dismissEmailReminder()">✕</button></div>
        <div class="modal-body">
          <p>Umeshaingiza taarifa kwenye mfumo leo lakini bado hujatuma taarifa ya leo kwa barua pepe.</p>
          <button class="btn amber" style="width:100%;justify-content:center;" onclick="closeModal(); openEmailModal();">✉️ Tuma Sasa</button>
        </div>

}
function dismissEmailReminder(){ localStorage.setItem('temesa_email_reminder_dismissed', todayISO()); closeModal(); }

/* ---------------------------- CLOUD BOOT + REALTIME SYNC ---------------------------- */
/** Inapakia database kutoka Firestore mara moja mwanzoni. Ikiwa hakuna data mtandaoni bado
 *  (mfumo mpya), inatuma nakala ya sasa (ya ndani/tupu) kwenda mtandaoni kama mwanzo. */
/** Inaunganisha data iliyopakuliwa (kutoka Firestore) na muundo kamili wa defaultDB() — hii inahakikisha
 *  data ya zamani (iliyohifadhiwa kabla ya sehemu mpya kama Posho/Matumizi/Vikao kuongezwa) haisababishi
 *  hitilafu ya "undefined" kwenye sehemu mpya; badala yake zinabaki tupu ([]) mpaka zijazwe. */
function mergeIntoDefaultDB(parsed){
  const d = defaultDB();
  for(const k in d){ if(parsed && parsed[k]) d[k] = parsed[k]; }
  return d;
}
async function bootFromCloud(){
  try{
    // Sign in kimya kimya (bila jina/nenosiri) ili Firestore Security Rules ziweze
    // kuruhusu ufikiaji WA APP HII TU (kupitia mtandao wa Firebase Auth), na kuzuia
    // mtu yeyote wa nje asiye na app hii kufikia database moja kwa moja.
    await firebase.auth().signInAnonymously();
    const snap = await dbDocRef.get();
    if(snap.exists && snap.data() && snap.data().json){
      DB = migrateDB(mergeIntoDefaultDB(JSON.parse(snap.data().json)));
      try{ localStorage.setItem(DB_KEY, JSON.stringify(DB)); }catch(e){}
    } else {
      // Hati bado haipo mtandaoni — hii ndiyo mara ya kwanza mfumo unawekwa online.
      // Tunatuma tuliyo nayo (ya ndani, au default tupu) ili iwe mwanzo wa data ya pamoja.
      DB.meta = DB.meta || {}; DB.meta.updatedAt = nowTime();
      await dbDocRef.set({ json: JSON.stringify(DB), updatedAt: DB.meta.updatedAt });
    }
    cloudReady = true;
    updateCloudBadge(true);
  }catch(e){
    console.error('Cloud boot failed, tunatumia nakala ya ndani (offline)', e);
    updateCloudBadge(false);
    toast("Imeshindwa kuunganisha na database ya mtandaoni. Kwa sasa unatumia nakala ya ndani ya kifaa hiki.","red");
  }
  attachCloudListener();
  initAuth();
}

/** Husikiliza mabadiliko kutoka kwa vifaa/watumiaji wengine wanaotumia mfumo huu huu, na
 *  kusasisha skrini papo hapo bila kuhitaji ku-refresh. Inapuuza "echo" ya maandishi yetu
 *  wenyewe (hasPendingWrites) ili isijirudie mzunguko usio na maana. */
function attachCloudListener(){
  dbDocRef.onSnapshot(snap=>{
    if(!snap.exists) return;
    if(snap.metadata.hasPendingWrites) return; // ni andiko letu wenyewe, bado halijathibitishwa na server
    const data = snap.data();
    if(!data || !data.json) return;
    let incoming;
    try{ incoming = migrateDB(mergeIntoDefaultDB(JSON.parse(data.json))); }catch(e){ return; }
    if(DB.meta && incoming.meta && DB.meta.updatedAt === incoming.meta.updatedAt) return; // hakuna kilichobadilika
    applyingRemoteUpdate = true;
    DB = incoming;
    try{ localStorage.setItem(DB_KEY, JSON.stringify(DB)); }catch(e){}
    if(currentUser){
      try{ buildSidebar(); render(); toast("Taarifa zimesasishwa — mabadiliko kutoka kifaa kingine yamepokelewa","green"); }
      catch(e){ console.error('Re-render after remote update failed', e); }
    }
    applyingRemoteUpdate = false;
    updateCloudBadge(true);
  }, err=>{
    console.error('Cloud listener error', err);
    updateCloudBadge(false);
  });
}

/* ============================== INIT ============================== */
bootFromCloud();
