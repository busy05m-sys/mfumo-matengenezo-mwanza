<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEMESA — Wakala wa Ufundi na Umeme — Mkoa wa Mwanza</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<style>
:root{
  --navy:#0B3350;
  --navy-2:#0F4C75;
  --navy-deep:#082438;
  --amber:#E8871E;
  --amber-soft:#FCE3C3;
  --green:#1E8449;
  --green-soft:#DEF3E4;
  --red:#C0392B;
  --red-soft:#FBE0DC;
  --slate:#5B6B79;
  --bg:#EFF3F6;
  --card:#FFFFFF;
  --line:#DDE5EC;
  --ink:#122436;
  --radius:12px;
  --shadow: 0 1px 2px rgba(11,51,80,.06), 0 8px 24px rgba(11,51,80,.06);
  font-family:'Inter',sans-serif;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;}
h1,h2,h3,h4{font-family:'Sora',sans-serif;margin:0;}
.mono{font-family:'JetBrains Mono',monospace;}
button{font-family:'Inter',sans-serif;cursor:pointer;}
input,select,textarea{font-family:'Inter',sans-serif;}

/* ---------- Layout shell ---------- */
#app{display:flex;min-height:100vh;}
#sidebar{
  width:250px;flex-shrink:0;background:linear-gradient(180deg,var(--navy-deep),var(--navy));
  color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;
}
.brand{padding:22px 20px 16px;border-bottom:1px solid rgba(255,255,255,.12);}
.brand .eyebrow{font-size:10.5px;letter-spacing:2.5px;color:var(--amber);font-weight:700;}
.brand .ministry-line{font-size:11px;letter-spacing:1px;color:#CFE0EC;font-weight:700;margin-top:5px;}
.brand h1{font-size:16.5px;line-height:1.3;margin-top:7px;color:#fff;}
.brand .region-line{font-size:11.5px;letter-spacing:1px;color:var(--amber);font-weight:700;margin-top:5px;}
.brand .sub{font-size:11px;color:#9FB4C6;margin-top:6px;}
nav.mainnav{padding:14px 10px;flex:1;}
.navgroup{margin-bottom:6px;}
.navgroup-label{font-size:10px;letter-spacing:1.8px;text-transform:uppercase;color:#7C93A6;padding:14px 12px 6px;font-weight:700;}
.navitem{
  display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;color:#CFE0EC;
  font-size:13.5px;font-weight:600;cursor:pointer;margin-bottom:2px;transition:.15s;border:1px solid transparent;
}
.navitem:hover{background:rgba(255,255,255,.06);color:#fff;}
.navitem.active{background:var(--amber);color:#1c1200;}
.navitem .ic{width:18px;text-align:center;font-size:15px;}
.sidebar-foot{padding:14px 20px;border-top:1px solid rgba(255,255,255,.1);font-size:10.5px;color:#7C93A6;}

#main{flex:1;min-width:0;display:flex;flex-direction:column;}
#topbar{
  background:var(--card);border-bottom:1px solid var(--line);padding:14px 26px;
  display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5;
}
#topbar .page-title{font-size:20px;font-weight:800;}
#topbar .page-desc{font-size:12.5px;color:var(--slate);margin-top:2px;}
.topbar-actions{display:flex;gap:10px;align-items:center;}
#content{padding:24px 26px 60px;flex:1;}

.view{display:none;}
.view.active{display:block;animation:fadein .25s ease;}
@keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

/* ---------- Reusable components ---------- */
.grid{display:grid;gap:16px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:1100px){.grid-4{grid-template-columns:repeat(2,1fr);}.grid-3{grid-template-columns:repeat(2,1fr);}}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);}
.card-pad{padding:18px 20px;}
.card-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line);}
.card-head h3{font-size:14.5px;font-weight:700;}
.card-head .hint{font-size:11.5px;color:var(--slate);}

.stat{padding:18px 20px;position:relative;overflow:hidden;}
.stat .stat-label{font-size:11.5px;color:var(--slate);font-weight:600;text-transform:uppercase;letter-spacing:.6px;}
.stat .stat-value{font-size:28px;font-weight:800;margin-top:6px;font-family:'Sora',sans-serif;}
.stat .stat-sub{font-size:11.5px;color:var(--slate);margin-top:4px;}
.stat .stat-bar{position:absolute;left:0;top:0;bottom:0;width:4px;}
.stat.blue .stat-bar{background:var(--navy-2);} .stat.blue .stat-value{color:var(--navy-2);}
.stat.amber .stat-bar{background:var(--amber);} .stat.amber .stat-value{color:#B8620C;}
.stat.green .stat-bar{background:var(--green);} .stat.green .stat-value{color:var(--green);}
.stat.red .stat-bar{background:var(--red);} .stat.red .stat-value{color:var(--red);}

.btn{
  display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:8px;border:1px solid transparent;
  font-size:13px;font-weight:700;background:var(--navy-2);color:#fff;transition:.15s;
}
.btn:hover{filter:brightness(1.08);}
.btn.secondary{background:#fff;color:var(--navy-2);border-color:var(--line);}
.btn.amber{background:var(--amber);color:#1c1200;}
.btn.green{background:var(--green);color:#fff;}
.btn.red{background:var(--red);color:#fff;}
.btn.ghost{background:transparent;color:var(--slate);border-color:var(--line);}
.btn.sm{padding:6px 11px;font-size:12px;}
.btn:disabled{opacity:.5;cursor:not-allowed;}

.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
.field label{font-size:12px;font-weight:700;color:var(--navy);}
.field .opt{font-weight:400;color:var(--slate);font-size:11px;}
.field input,.field select,.field textarea{
  border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:13.5px;background:#FBFCFD;color:var(--ink);
}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--navy-2);outline-offset:1px;background:#fff;}
.field textarea{resize:vertical;min-height:70px;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:0 16px;}
.form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 16px;}

table{width:100%;border-collapse:collapse;font-size:13px;}
table th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--slate);
  padding:10px 14px;border-bottom:2px solid var(--line);background:#F7FAFC;font-weight:700;}
table td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle;}
table tr:hover td{background:#F9FBFD;}
.table-wrap{overflow-x:auto;border-radius:var(--radius);}

.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap;}
.badge.dot::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;}
.badge.gray{background:#EAEFF3;color:#5B6B79;}
.badge.amber{background:var(--amber-soft);color:#9C5B0C;}
.badge.green{background:var(--green-soft);color:var(--green);}
.badge.red{background:var(--red-soft);color:var(--red);}
.badge.blue{background:#DCEAFB;color:var(--navy-2);}

.pill-tabs{display:flex;gap:6px;background:#E7EDF2;padding:4px;border-radius:10px;width:fit-content;margin-bottom:18px;}
.pill-tab{padding:8px 16px;border-radius:8px;font-size:12.5px;font-weight:700;color:var(--slate);}
.pill-tab.active{background:#fff;color:var(--navy);box-shadow:var(--shadow);}

.modal-bg{display:none;position:fixed;inset:0;background:rgba(8,36,56,.55);z-index:50;align-items:flex-start;justify-content:center;overflow-y:auto;padding:40px 16px;}
.modal-bg.active{display:flex;}
.modal{background:#fff;border-radius:14px;width:100%;max-width:640px;box-shadow:0 20px 60px rgba(0,0,0,.3);}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
.modal-head h3{font-size:16px;}
.modal-body{padding:20px 22px;max-height:70vh;overflow-y:auto;}
.modal-foot{padding:16px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;}
.modal-x{border:none;background:#F0F3F6;width:30px;height:30px;border-radius:50%;font-size:15px;color:var(--slate);}

.searchbar{display:flex;gap:10px;margin-bottom:16px;}
.searchbar input{flex:1;border:1px solid var(--line);border-radius:9px;padding:10px 14px;font-size:13.5px;}

.empty{padding:50px 20px;text-align:center;color:var(--slate);}
.empty .ic{font-size:34px;margin-bottom:10px;}

.toast-wrap{position:fixed;bottom:22px;right:22px;z-index:100;display:flex;flex-direction:column;gap:10px;}
.toast{background:var(--navy-deep);color:#fff;padding:12px 18px;border-radius:9px;font-size:13px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:toastin .2s ease;display:flex;align-items:center;gap:8px;}
.toast.green{background:var(--green);} .toast.red{background:var(--red);}
@keyframes toastin{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

.chip-row{display:flex;flex-wrap:wrap;gap:8px;}
.divider{height:1px;background:var(--line);margin:16px 0;}
.small{font-size:11.5px;color:var(--slate);}
a.linklike{color:var(--navy-2);font-weight:700;cursor:pointer;}
.flex-between{display:flex;align-items:center;justify-content:space-between;}
.copybtn{border:1px solid var(--line);background:#fff;border-radius:7px;padding:4px 9px;font-size:11px;font-weight:700;color:var(--navy-2);}

.rank-card{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:10px;border:1px solid var(--line);margin-bottom:10px;}
.rank-num{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-family:'Sora',sans-serif;color:#fff;flex-shrink:0;}
.rank-1 .rank-num{background:#D4A017;} .rank-2 .rank-num{background:#9AA5AD;} .rank-3 .rank-num{background:#B5651D;}
.rank-info{flex:1;} .rank-info b{font-size:13.5px;} .rank-info .small{margin-top:2px;}
.rank-score{text-align:right;} .rank-score b{font-size:16px;font-family:'Sora',sans-serif;color:var(--navy);} 

.progress-track{height:8px;border-radius:6px;background:#E7EDF2;overflow:hidden;}
.progress-fill{height:100%;border-radius:6px;background:var(--navy-2);}
.progress-fill.over{background:var(--green);}
.progress-fill.warn{background:var(--amber);}
.progress-fill.low{background:var(--red);}

/* print */
/* ---------- Auth screen ---------- */
#authScreen{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 30% 20%, #0F4C75, #082438 65%);padding:24px;
}
.auth-card{background:#fff;border-radius:16px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden;}
.auth-head{background:linear-gradient(180deg,var(--navy-deep),var(--navy));padding:28px 28px 22px;text-align:center;}
.auth-head img{height:56px;margin-bottom:10px;}
.auth-head .eyebrow{font-size:10px;letter-spacing:2px;color:var(--amber);font-weight:700;}
.auth-head h1{color:#fff;font-size:15px;margin-top:6px;line-height:1.3;}
.auth-body{padding:26px 28px 28px;}
.auth-error{background:var(--red-soft);color:var(--red);border-radius:8px;padding:9px 12px;font-size:12.5px;font-weight:600;margin-bottom:14px;display:none;}
.auth-error.show{display:block;}
.auth-foot{padding:16px 28px;background:#F7FAFC;border-top:1px solid var(--line);text-align:center;font-size:11.5px;color:var(--slate);}

@media print{
  #sidebar,#topbar,.no-print,#toastWrap,#modalBg,#authScreen{display:none !important;}
  #content{padding:0;}
  body{background:#fff;}
  .view{display:none !important;}
  .view.print-active{display:block !important;}
  .card{box-shadow:none;border:1px solid #ccc;}
}
@keyframes blinkAlert{ 0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,.35);} 50%{box-shadow:0 0 0 8px rgba(220,38,38,0);} }
.blink-alert{ animation: blinkAlert 1.4s infinite; }
</style>
</head>

    <div id="content"></div>
  </div>
</div>
<div class="toast-wrap" id="toastWrap"></div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modalBox"></div></div>

let DB = loadDB();
function loadDB(){
  try{
    const raw = localStorage.getItem(DB_KEY);
    if(!raw){ const d = migrateDB(defaultDB()); return d; }
    const parsed = JSON.parse(raw);
    const d = defaultDB();
    for(const k in d){ if(parsed[k]) d[k] = parsed[k]; }
    const migrated = migrateDB(d);
    // Persist the migration result immediately — otherwise an upgrade like "old single budget field →
    // split vehicles/MIFUMO budgets" only lives in memory until something else happens to trigger a save,
    // and a reload before that would silently re-derive it from the same old data (harmless but confusing
    // to debug). Writing it back straight away means what you see on screen is exactly what's on disk.
    try{ localStorage.setItem(DB_KEY, JSON.stringify(migrated)); }catch(e){}
    return migrated;
  }catch(e){ console.error("DB load failed", e); return migrateDB(defaultDB()); }
}
/** Upgrades data saved by older versions of the system so nothing already entered is lost:
 *  - single technicianId/assistantId → technicianIds[]/assistantIds[] (multi-select support)
 *  - builds the reusable Vehicle/MIFUMO-location registries out of whatever was already saved
 */
function migrateDB(d){
  d.vehicles.forEach(v=>{
    if(!Array.isArray(v.technicianIds)) v.technicianIds = v.technicianId ? [v.technicianId] : [];
    if(!Array.isArray(v.assistantIds)) v.assistantIds = v.assistantId ? [v.assistantId] : [];
  });
  // A Regional Manager saved before scoped budgets existed only has one lump annualBudget — carry it over
  // as the vehicles-side budget by default (editable in Wafanyakazi afterwards) rather than losing it.
  // Also catches the case where both scoped fields ended up at 0 for any reason, as long as there's an
  // old annualBudget to recover from.
  d.staff.forEach(s=>{
    const unmigrated = s.vehicleBudget===undefined && s.mifumoBudget===undefined;
    const bothZero = !s.vehicleBudget && !s.mifumoBudget;
    if(isRegionalManagerRole(s.role) && (unmigrated || bothZero) && Number(s.annualBudget||0)>0){
      s.vehicleBudget = s.annualBudget || 0;
      s.mifumoBudget = s.mifumoBudget || 0;
    }
  });
  d.mifumoJobs.forEach(j=>{
    if(!Array.isArray(j.technicianIds)) j.technicianIds = j.technicianId ? [j.technicianId] : [];
    if(!Array.isArray(j.assistantIds)) j.assistantIds = j.assistantId ? [j.assistantId] : [];
  });
  if(d.vehicleRegistry.length===0 && d.vehicles.length>0){
    const seen = new Set();
    d.vehicles.forEach(v=>{
      const key = (v.regNo||'').trim().toUpperCase();
      if(key && !seen.has(key)){
        seen.add(key);
        d.vehicleRegistry.push({id:uid('vreg'), regNo:v.regNo, owner:v.owner, driverName:v.driverName||'', driverPhone:v.driverPhone||'', createdAt:v.createdAt||nowTime()});
      }
    });
  }
  if(d.mifumoLocations.length===0 && d.mifumoJobs.length>0){
    const seen = new Set();
    d.mifumoJobs.forEach(j=>{
      const key = (j.location||'').trim().toUpperCase();
      if(key && !seen.has(key)){
        seen.add(key);
        d.mifumoLocations.push({id:uid('mloc'), location:j.location, createdAt:j.createdAt||nowTime()});
      }
    });
  }
  d.mifumoJobs.forEach(j=>{ if(!j.unit) j.unit = 'matengenezo'; });
  // Default posho (allowance) figures kwa kila mtumishi - flexible, yanaweza kubadilishwa kwa mtu mmoja mmoja
  d.staff.forEach(s=>{
    if(s.lunchAllowanceDefault===undefined) s.lunchAllowanceDefault = 250000;
    if(s.transportAllowanceDefault===undefined) s.transportAllowanceDefault = 120000;
  });
  // Ruhusa mpya za Kuhariri/Kufuta - default HAPANA kwa watumiaji wa kawaida, Admin ana ruhusa zote moja kwa moja
  d.users.forEach(u=>{
    if(u.canEdit===undefined) u.canEdit = !!u.isAdmin;
    if(u.canDelete===undefined) u.canDelete = !!u.isAdmin;
  });
  // Old spare-parts records only had vehicleId + cost + status — upgrade them to the fuller INVENTORY shape.
  d.spareParts.forEach(p=>{
    if(!p.jobRefType){ p.jobRefType = 'vehicle'; p.jobRefId = p.vehicleId || p.jobRefId || null; }
    if(p.quantity === undefined) p.quantity = 1;
    if(p.unitCost === undefined) p.unitCost = p.cost || 0;
    if(p.orderDate === undefined) p.orderDate = p.createdAt ? p.createdAt.slice(0,10) : todayISO();
    if(p.receivedDate === undefined) p.receivedDate = p.status==='imepokewa' ? (p.createdAt?p.createdAt.slice(0,10):todayISO()) : null;
    if(p.returnedQty === undefined) p.returnedQty = 0;
  });
  // Jobs marked "Imelipiwa" using the old paid/unpaid toggle (before the "Kiasi Kilicholipwa" auto-sync
  // existed) never got an actual payment record created — that's why their revenue was invisible on
  // Mapato & Malipo and Utendaji & Mafundi Bora even though the job itself said "Imelipiwa". Backfill the
  // missing payment now so historical work is credited correctly, without touching anything already correct.
  d.vehicles.forEach(v=>{
    if(v.paid && Number(v.totalCost||0)>0){
      const recorded = d.payments.filter(p=>p.vehicleId===v.id).reduce((a,p)=>a+Number(p.amount||0),0);
      const gap = Number(v.totalCost) - recorded;
      if(gap > 0.5){
        d.payments.push({id:uid('pay'), vehicleId:v.id, amount: gap,
          date: v.completedDate || (v.completedAt?v.completedAt.slice(0,10):(v.createdAt?v.createdAt.slice(0,10):todayISO())),
          note:'Malipo yaliyorejeshwa kiotomatiki wakati wa kusasisha mfumo (kazi hii ilikuwa tayari imewekwa "Imelipiwa")',
          createdAt:nowTime()});
      }
    }
  });
  d.mifumoJobs.forEach(j=>{
    if(j.paid && Number(j.totalCost||0)>0){
      const recorded = d.mifumoPayments.filter(p=>p.jobId===j.id).reduce((a,p)=>a+Number(p.amount||0),0);
      const gap = Number(j.totalCost) - recorded;
      if(gap > 0.5){
        d.mifumoPayments.push({id:uid('mfp'), jobId:j.id, amount: gap,
          date: j.completedDate || (j.completedAt?j.completedAt.slice(0,10):(j.createdAt?j.createdAt.slice(0,10):todayISO())),
          note:'Malipo yaliyorejeshwa kiotomatiki wakati wa kusasisha mfumo (kazi hii ilikuwa tayari imewekwa "Imelipiwa")',
          createdAt:nowTime()});
      }
    }
  });
  return d;
}
function saveDB(){
  DB.meta = DB.meta || {};
  DB.meta.updatedAt = nowTime();
  try{ localStorage.setItem(DB_KEY, JSON.stringify(DB)); }
  catch(e){ toast("Hifadhi ya kivinjari imeshindikana: " + e.message, "red"); }
  // Shadow copy in IndexedDB (survives some cases where localStorage alone is cleared)
  idbSet('data','db_snapshot', DB).catch(()=>{});
  // Tuma nakala kwenye Firestore (database ya mtandaoni) ili vifaa vingine
  // vinavyofungua mfumo huu vione mabadiliko haya. Haizuii mtumiaji kuendelea
  // kufanya kazi hata kama mtandao ni hafifu — itajaribu tena kimya kimya.
  if(!applyingRemoteUpdate){
    dbDocRef.set({ json: JSON.stringify(DB), updatedAt: DB.meta.updatedAt })
      .then(()=>{ updateCloudBadge(true); })
      .catch(err=>{
        console.error('Cloud save failed', err);
        updateCloudBadge(false);
      });
  }
  // If connected to a real file on disk, write there too — this is the durable copy
  if(fsConnected && fsHandle){
    writeToRealFile().catch(err=>{
      console.error('Real-file write failed', err);
      fsConnected = false; updateSyncBadge();
      toast("Uunganisho na faili halisi umekatika. Bonyeza alama ya juu kuunganisha tena.","red");
    });
  }
  changesSinceBackup++;
  maybeAutoBackup();
}

/* ---------------------------- ROBUST PERSISTENCE: IndexedDB shadow copy + Real File Sync ---------------------------- */
const IDB_NAME = 'temesa_persist_v1';
let fsHandle = null;          // connected FileSystemFileHandle, if any
let fsConnected = false;      // true only once permission is confirmed granted
let changesSinceBackup = 0;
let lastAutoBackupAt = 0;

function idbOpen(){
  return new Promise((resolve,reject)=>{
    if(!window.indexedDB){ reject(new Error('no indexeddb')); return; }
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if(!db.objectStoreNames.contains('data')) db.createObjectStore('data');
      if(!db.objectStoreNames.contains('handles')) db.createObjectStore('handles');
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbSet(store, key, value){
  try{
    const db = await idbOpen();
    return new Promise((resolve,reject)=>{
      const tx = db.transaction(store,'readwrite');
      tx.objectStore(store).put(value, key);
      tx.oncomplete = ()=>resolve(true);
      tx.onerror = ()=>reject(tx.error);
    });
  }catch(e){ return false; }
}
async function idbGet(store, key){
  try{
    const db = await idbOpen();
    return new Promise((resolve,reject)=>{
      const tx = db.transaction(store,'readonly');
      const req = tx.objectStore(store).get(key);
      req.onsuccess = ()=>resolve(req.result);
      req.onerror = ()=>reject(req.error);
    });
  }catch(e){ return null; }
}

async function writeToRealFile(){
  if(!fsHandle) return;
  const perm = await fsHandle.queryPermission({mode:'readwrite'});
  if(perm !== 'granted') throw new Error('Ruhusa haipo');
  const writable = await fsHandle.createWritable();
  await writable.write(JSON.stringify(DB, null, 2));
  await writable.close();
}

/** User-triggered (button click = has user gesture, required by browser security). */
async function connectRealFile(){
  if(!window.showSaveFilePicker){
    toast("Kivinjari chako hakitumii kipengele hiki. Tumia Google Chrome au Microsoft Edge kwa uhifadhi wa uhakika zaidi.","red");
    return;
  }
  try{
    const handle = await window.showSaveFilePicker({
      suggestedName: 'temesa_mwanza_data.json',
      types: [{ description:'TEMESA Data (JSON)', accept:{'application/json':['.json']} }]
    });
    fsHandle = handle; fsConnected = true;
    await idbSet('handles','file_handle', handle);
    await writeToRealFile();
    updateSyncBadge();
    toast("Umeunganishwa! Taarifa zako sasa zinahifadhiwa moja kwa moja kwenye faili hilo la kudumu.","green");
  }catch(e){
    if(e.name !== 'AbortError') toast("Imeshindikana kuunganisha faili: "+e.message,"red");
  }
}

/** Called automatically on load — tries to reconnect to a previously-chosen file without asking again. */
async function trySilentReconnect(){
  try{
    const handle = await idbGet('handles','file_handle');
    if(!handle) return;
    fsHandle = handle;
    const perm = await handle.queryPermission({mode:'readwrite'});
    if(perm === 'granted'){
      fsConnected = true;
      try{
        const file = await handle.getFile();
        const text = await file.text();
        if(text && text.trim()){
          const fileDB = JSON.parse(text);
          const fileTime = fileDB.meta && fileDB.meta.updatedAt ? new Date(fileDB.meta.updatedAt).getTime() : 0;
          const localTime = DB.meta && DB.meta.updatedAt ? new Date(DB.meta.updatedAt).getTime() : 0;
          if(fileTime >= localTime){
            const d = defaultDB();
            for(const k in d){ if(fileDB[k] !== undefined) d[k] = fileDB[k]; }
            DB = d;
            localStorage.setItem(DB_KEY, JSON.stringify(DB));
            render();
          } else {
            await writeToRealFile();
          }
        } else {
          await writeToRealFile();
        }
      }catch(e){ console.error('Reconcile ya faili imeshindikana', e); }
    }
    // perm === 'prompt' → user must click the badge to re-grant; handled by updateSyncBadge()
  }catch(e){ /* no stored handle / not supported — silently ignore */ }
}
async function requestReconnectPermission(){
  if(!fsHandle) return;
  try{
    const perm = await fsHandle.requestPermission({mode:'readwrite'});
    if(perm === 'granted'){
      fsConnected = true; updateSyncBadge();
      await writeToRealFile();
      toast("Umeunganishwa tena na faili lako la kudumu!","green");
    } else {
      toast("Ruhusa haikutolewa. Bonyeza 'Unganisha Faili Salama' kuchagua tena.","red");
    }
  }catch(e){ toast("Imeshindwa kuomba ruhusa","red"); }
}

}

/** Deterministic fallback hash (FNV-1a) used only if the Web Crypto API is unavailable or fails on a
 *  particular machine/browser — this is what causes "works on the laptop, not on this Desktop" logins,
 *  since crypto.subtle can behave inconsistently across browsers when a page is opened from file://. Using
 *  the SAME algorithm everywhere (with SHA-256 preferred, this as a guaranteed-available fallback) keeps
 *  login working identically on every computer regardless of that quirk. */
function fnv1aHash(str){
  let h = 0x811c9dc5;
  for(let i=0;i<str.length;i++){
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 0x01000193);
  }
  return 'fnv:' + (h>>>0).toString(16).padStart(8,'0');
}
async function hashPassword(pw){
  pw = (pw||'').trim();
  try{
    if(window.crypto && window.crypto.subtle && window.crypto.subtle.digest){
      const enc = new TextEncoder().encode(pw);
      const buf = await crypto.subtle.digest('SHA-256', enc);
      return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
    }
  }catch(e){ console.error('crypto.subtle unavailable, using fallback hash', e); }
  return fnv1aHash(pw);
}
/** Old accounts may have a SHA-256 hash saved from a machine where Web Crypto worked; if crypto.subtle isn't
 *  available on THIS machine we can't recompute that same hash, but we CAN still check the fallback in case
 *  the account was created with the fallback originally. This function tries both so a password that is
 *  genuinely correct is never wrongly rejected just because of which machine created the account. */
async function passwordMatches(pw, storedHash){
  pw = (pw||'').trim();
  if(storedHash && storedHash.startsWith('fnv:')) return fnv1aHash(pw) === storedHash;
  try{
    if(window.crypto && window.crypto.subtle && window.crypto.subtle.digest){
      const enc = new TextEncoder().encode(pw);
      const buf = await crypto.subtle.digest('SHA-256', enc);
      const sha = [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
      if(sha === storedHash) return true;
    }
  }catch(e){ console.error('crypto.subtle check failed', e); }
  return fnv1aHash(pw) === storedHash;
}

  if(!el){
    el = document.createElement('div');
    el.className = 'view';
    el.id = 'view_'+currentView;

  }
  document.querySelectorAll('.view').forEach(v=>v.style.display='none');
  el.style.display='block';
  el.classList.add('active');
  fn(el);
}

function staffById(id){ return DB.staff.find(s=>s.id===id); }
function vehicleById(id){ return DB.vehicles.find(v=>v.id===id); }
function supplierById(id){ return DB.suppliers.find(s=>s.id===id); }
function staffName(id){ const s=staffById(id); return s? s.name : "—"; }
/** Comma-joined display names for a list of staff ids — used wherever multiple technicians/assistants can be on one job. */
function staffNames(ids){
  if(!ids || ids.length===0) return "—";
  return ids.map(id=>{ const s=staffById(id); return s? s.name : null; }).filter(Boolean).join(', ') || "—";
}
function vehiclePaidTotal(vId){ return DB.payments.filter(p=>p.vehicleId===vId).reduce((a,p)=>a+Number(p.amount||0),0); }

/* Date range filters */
/** TEMESA's financial year runs 1 July – 30 June (not the calendar year). These helpers group any date into
 *  the correct fiscal year/quarter/half so "Robo Mwaka", "Nusu Mwaka" and "Mwaka Huu" filters line up correctly:
 *  FY starts 1 Jul. Q1: Jul–Sep, Q2: Oct–Dec, Q3: Jan–Mar, Q4: Apr–Jun. H1: Jul–Dec, H2: Jan–Jun. */
function fyYear(date){ const m = date.getMonth(); return m>=6 ? date.getFullYear() : date.getFullYear()-1; }
function fyMonthIndex(date){ return (date.getMonth() - 6 + 12) % 12; } // 0 = July ... 11 = June
function inRange(dateStr, range){
  const d = new Date(dateStr);
  const now = new Date();
  if(range==='day'){ return d.toDateString()===now.toDateString(); }
  if(range==='week'){ const wk=new Date(now); wk.setDate(now.getDate()-7); return d>=wk && d<=now; }
  if(range==='month'){ return d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth(); }
  if(range==='quarter'){ return fyYear(d)===fyYear(now) && Math.floor(fyMonthIndex(d)/3)===Math.floor(fyMonthIndex(now)/3); }
  if(range==='half'){ return fyYear(d)===fyYear(now) && Math.floor(fyMonthIndex(d)/6)===Math.floor(fyMonthIndex(now)/6); }
  if(range==='year'){ return fyYear(d)===fyYear(now); }
  return true;
}

/** Vikao/ratiba za siku 3 zijazo (au zilizopita bila kufutwa) - zinang'aa (blink) kumkumbusha Meneja. */
function renderAppointmentReminders(){
  const now = new Date();
  const soon = DB.appointments.filter(a=>{
    const d = new Date(a.date + 'T' + (a.time||'00:00'));
    const diffDays = (d - now) / (1000*60*60*24);
    return diffDays >= -1 && diffDays <= 3; // jana mpaka siku 3 zijazo
  }).sort((a,b)=> (a.date+a.time).localeCompare(b.date+b.time));
  if(soon.length===0) return '';
  return `<div class="card blink-alert" style="margin-bottom:16px;border:2px solid var(--red);background:#FFF7F5;">
    <div class="card-head" style="border:none;"><h3 style="color:var(--red);">🔔 Ukumbusho: Vikao na Ratiba za Karibuni</h3></div>
    <div class="card-pad" style="padding-top:0;">
      ${soon.map(a=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line);">
        <div><b>${esc(a.title)}</b> <span class="small">— ${esc(a.location||'')}</span></div>
        <div class="small" style="font-weight:700;">${esc(a.date)} ${esc(a.time||'')}</div>
      </div>`).join('')}
    </div>
  </div>`;
}

/** Live search-as-you-type across registration number, owner, AND driver name — so on a repeat visit,
 *  staff can find the vehicle by typing whichever they remember. */
function filterVehicleRegistrySearch(query){
  const box = document.getElementById('f_regSearchResults');
  const selectedIdField = document.getElementById('f_regSelectedId');
  const infoBox = document.getElementById('vExistingInfo');
  selectedIdField.value = '';
  infoBox.style.display = 'none';
  const q = query.trim().toLowerCase();
  if(!q){ box.style.display='none'; box.innerHTML=''; return; }
  const matches = DB.vehicleRegistry.filter(r=>
    r.regNo.toLowerCase().includes(q) || (r.owner||'').toLowerCase().includes(q) || (r.driverName||'').toLowerCase().includes(q)
  ).slice(0,8);
  box.style.display = 'block';
  if(matches.length===0){
    box.innerHTML = `<div class="empty small" style="padding:14px;">Hakuna gari linalolingana. Tumia "Gari Jipya" kulisajili.</div>`;
    return;
  }
  box.innerHTML = `<table><tbody>${matches.map(r=>`
    <tr style="cursor:pointer;" onclick="selectVehicleFromSearch('${r.id}')">
      <td class="mono" style="font-weight:700;padding:8px 10px;">${esc(r.regNo)}</td>
      <td style="padding:8px 10px;">${esc(r.owner)}</td>
      <td class="small" style="padding:8px 10px;">${esc(r.driverName||'—')}</td>
    </tr>`).join('')}</tbody></table>`;
}
/** Selecting a match brings back everything already known about this vehicle (owner, driver, last recorded
 *  KM) and pre-fills the KM field with the most recent reading — the person only needs to update what's
 *  actually new for this visit (current KM, the issue this time), not re-type the vehicle's identity. */
function selectVehicleFromSearch(regId){
  const r = DB.vehicleRegistry.find(x=>x.id===regId);
  if(!r) return;
  document.getElementById('f_regSelectedId').value = regId;

function saveVehicle(){
  const usingExisting = document.querySelector('#vSourceTabs .pill-tab.active').dataset.src === 'existing';
  const km = document.getElementById('f_km').value;
  const need = document.getElementById('f_need').value.trim();
  let regEntry;
  if(usingExisting){
    const regId = document.getElementById('f_regSelectedId').value;
    regEntry = DB.vehicleRegistry.find(x=>x.id===regId);
    if(!regEntry){ toast("Tafuta na uchague gari kwenye orodha","red"); return; }
  } else {
    const regNo = document.getElementById('f_regNo').value.trim();
    const owner = document.getElementById('f_owner').value.trim();
    if(!regNo || !owner){ toast("Jaza Namba ya Usajili na Mmiliki","red"); return; }
    const driverName = document.getElementById('f_dname').value.trim();
    const driverPhone = document.getElementById('f_dphone').value.trim();
    // Avoid duplicate registry entries if this reg no already exists
    regEntry = DB.vehicleRegistry.find(x=>x.regNo.trim().toUpperCase()===regNo.toUpperCase());
    if(!regEntry){
      regEntry = {id:uid('vreg'), regNo, owner, driverName, driverPhone, createdAt:nowTime()};
      DB.vehicleRegistry.push(regEntry);
    } else {
      regEntry.owner = owner; regEntry.driverName = driverName; regEntry.driverPhone = driverPhone;
    }
  }
  if(!km || !need){ toast("Tafadhali jaza taarifa zote muhimu (*)", "red"); return; }
  const v = {
    id: uid('veh'), vehicleRegId: regEntry.id, regNo:regEntry.regNo, owner:regEntry.owner,
    currentKm:Number(km), neededMaintenance:need,
    unit: document.getElementById('f_unit').value, status:'haijaanza',
    technicianIds:[], assistantIds:[], startDate:null, completedDate:null, startedAt:null, completedAt:null, hoursSpent:0,
    paid:false, amountPaid:0, totalCost:0, authorizedBy:'', authorizedDate:'',
    driverName: regEntry.driverName||'', driverPhone: regEntry.driverPhone||'',
    serviceIntervalKm: 5000, nextServiceKm: null,
    createdAt: nowTime()
  };
  DB.vehicles.push(v); saveDB(); closeModal(); toast("Kazi ya gari "+v.regNo+" imesajiliwa","green");
  renderVehicles(document.getElementById('view_vehicles'));
}

/** Live preview while editing: shows Imelipiwa/Deni and toggles the authorization box, computed from the
 *  amount typed so far (not yet saved) so staff see the effect immediately. */
function updateVehiclePaidPreview(){
  const previewBox = document.getElementById('vehiclePaidPreview');
  const authBox = document.getElementById('authBox');
  if(!previewBox) return;
  const total = Number(document.getElementById('d_total').value)||0;
  const paidSoFar = Number(document.getElementById('d_amountPaid').value)||0;
  const balance = Math.max(0, total - paidSoFar);
  const fullyPaid = total>0 && paidSoFar >= total;
  previewBox.innerHTML = `Kimeshalipwa: <b>${fmtMoney(paidSoFar)}</b> · Deni: <b>${fmtMoney(balance)}</b> · Hali: ${fullyPaid ? '<span class="badge green dot">Imelipiwa</span>' : '<span class="badge red dot">Bado</span>'}`;
  if(authBox) authBox.style.display = fullyPaid ? 'none' : 'block';
}
function updateMaintSizeBadge(){
  const box = document.getElementById('maintSizeBadge');
  if(!box) return;
  const total = Number(document.getElementById('d_total').value)||0;
  const cls = maintSizeClass(total);
  if(!cls){ box.innerHTML = '<span class="badge gray dot">Bado hakijawekwa gharama</span>'; return; }
  const m = MAINT_SIZE_LABELS[cls];
  box.innerHTML = `<span class="badge ${m.cls} dot">${m.label}</span>`;
}

function saveVehicleDetail(id){
  const v = vehicleById(id);
  const wasCompleted = v.status==='imekamilika';
  v.currentKm = Number(document.getElementById('d_km').value)||0;
  v.status = document.getElementById('d_status').value;
  v.neededMaintenance = document.getElementById('d_need').value.trim();
  v.technicianIds = readCheckedIds('d_techChecks');
  v.assistantIds = readCheckedIds('d_assistChecks');
  v.hoursSpent = Number(document.getElementById('d_hours').value)||0;
  v.totalCost = Number(document.getElementById('d_total').value)||0;
  v.serviceIntervalKm = Number(document.getElementById('d_serviceInterval').value)||5000;
  const manualNextService = document.getElementById('d_nextServiceKm').value;
  v.nextServiceKm = manualNextService ? Number(manualNextService) : v.nextServiceKm;
  const manualStartDate = document.getElementById('d_startDate').value;
  const manualCompletedDate = document.getElementById('d_completedDate').value;
  // Reconcile the amount paid: if the figure typed here is higher than what's on record, auto-create the
  // matching payment entry so it shows up in Mapato & Malipo without anyone re-typing it there.
  const recordedPaid = vehiclePaidTotal(id);
  const enteredPaid = Number(document.getElementById('d_amountPaid').value)||0;
  if(enteredPaid > recordedPaid + 0.5){
    DB.payments.push({id:uid('pay'), vehicleId:id, amount: enteredPaid - recordedPaid, date: todayISO(),
      note:'Kiasi kilichowekwa wakati wa kusajili/kuhariri kazi', createdAt:nowTime()});
  }
  v.paid = v.totalCost>0 && vehiclePaidTotal(id) >= v.totalCost;
  if(!v.paid){
    v.authorizedBy = document.getElementById('d_authBy').value.trim();
    v.authorizedDate = document.getElementById('d_authDate').value;
  } else {
    v.authorizedBy=''; v.authorizedDate='';
  }
  v.driverName = document.getElementById('d_dname').value.trim();
  v.driverPhone = document.getElementById('d_dphone').value.trim();
  // Sync latest driver contact back to the reusable vehicle registry
  if(v.vehicleRegId){
    const reg = DB.vehicleRegistry.find(r=>r.id===v.vehicleRegId);
    if(reg){ reg.driverName = v.driverName; reg.driverPhone = v.driverPhone; }
  }
  if(v.status==='imekamilika' && !v.completedAt) v.completedAt = nowTime();
  if(v.status==='inaendelea' && !v.startedAt) v.startedAt = nowTime();
  v.startDate = manualStartDate || v.startDate || (v.startedAt ? v.startedAt.slice(0,10) : null);
  v.completedDate = manualCompletedDate || v.completedDate || (v.completedAt ? v.completedAt.slice(0,10) : null);
  // Auto-set next service KM the moment a job newly becomes "imekamilika", unless user already typed one manually above.
  if(v.status==='imekamilika' && !wasCompleted && !manualNextService){
    v.nextServiceKm = v.currentKm + (v.serviceIntervalKm||5000);
  }
  saveDB(); closeModal(); toast("Taarifa za "+v.regNo+" zimehifadhiwa","green");
  if(Number(v.totalCost||0)>0 && v.technicianIds.length===0 && v.assistantIds.length===0){
    toast("⚠ Hakuna fundi aliyechaguliwa kwa kazi hii — mapato yake hayataonekana kwenye Utendaji & Mafundi Bora mpaka umchague fundi.","red");
  }
  renderVehicles(document.getElementById('view_vehicles'));
}

function deleteVehicle(id){
  if(!requireDelete()) return;
  if(!confirm("Una uhakika unataka kufuta gari hili? Vipuri na malipo yake pia yatafutika.")) return;
  DB.vehicles = DB.vehicles.filter(v=>v.id!==id);
  DB.spareParts = DB.spareParts.filter(p=>!(p.jobRefType==='vehicle' && p.jobRefId===id));
  DB.payments = DB.payments.filter(p=>p.vehicleId!==id);
  DB.feedback = DB.feedback.filter(f=>!(f.refType==='vehicle' && f.refId===id));
  saveDB(); closeModal(); toast("Gari limefutwa","green");
  renderVehicles(document.getElementById('view_vehicles'));
}

function saveMifumo(){
  const usingExisting = document.querySelector('#mfSourceTabs .pill-tab.active').dataset.src === 'existing';
  const description = document.getElementById('mf_description').value.trim();
  let locEntry;
  if(usingExisting){
    const locId = document.getElementById('mf_locExisting').value;
    locEntry = DB.mifumoLocations.find(x=>x.id===locId);
    if(!locEntry){ toast("Chagua eneo kwenye orodha","red"); return; }
  } else {
    const location = document.getElementById('mf_location').value.trim();
    if(!location){ toast("Andika eneo/mteja","red"); return; }
    const contactName = document.getElementById('mf_contactName').value.trim();
    const contactPhone = document.getElementById('mf_contactPhone').value.trim();
    locEntry = DB.mifumoLocations.find(x=>x.location.trim().toUpperCase()===location.toUpperCase());

function updateMifumoPaidPreview(){
  const previewBox = document.getElementById('mifumoPaidPreview');
  const authBox = document.getElementById('mfd_authBox');
  if(!previewBox) return;
  const total = Number(document.getElementById('mfd_total').value)||0;
  const paidSoFar = Number(document.getElementById('mfd_amountPaid').value)||0;
  const balance = Math.max(0, total - paidSoFar);
  const fullyPaid = total>0 && paidSoFar >= total;
  previewBox.innerHTML = `Kimeshalipwa: <b>${fmtMoney(paidSoFar)}</b> · Deni: <b>${fmtMoney(balance)}</b> · Hali: ${fullyPaid ? '<span class="badge green dot">Imelipiwa</span>' : '<span class="badge red dot">Bado</span>'}`;
  if(authBox) authBox.style.display = fullyPaid ? 'none' : 'block';
}
function saveMifumoDetail(id){
  const j = mifumoJobById(id);
  j.unit = document.getElementById('mfd_unit').value;
  j.jobType = document.getElementById('mfd_type').value;
  j.status = document.getElementById('mfd_status').value;
  j.location = document.getElementById('mfd_location').value.trim();
  j.description = document.getElementById('mfd_description').value.trim();
  j.technicianIds = readCheckedIds('mfd_techChecks');
  j.assistantIds = readCheckedIds('mfd_assistChecks');
  j.hoursSpent = Number(document.getElementById('mfd_hours').value)||0;
  j.totalCost = Number(document.getElementById('mfd_total').value)||0;
  const manualStartDate = document.getElementById('mfd_startDate').value;
  const manualCompletedDate = document.getElementById('mfd_completedDate').value;
  const recordedPaid = mifumoJobPaidTotal(id);
  const enteredPaid = Number(document.getElementById('mfd_amountPaid').value)||0;
  if(enteredPaid > recordedPaid + 0.5){
    DB.mifumoPayments.push({id:uid('mfp'), jobId:id, amount: enteredPaid - recordedPaid, date: todayISO(),
      note:'Kiasi kilichowekwa wakati wa kusajili/kuhariri kazi', createdAt:nowTime()});
  }
  j.paid = j.totalCost>0 && mifumoJobPaidTotal(id) >= j.totalCost;
  if(!j.paid){
    j.authorizedBy = document.getElementById('mfd_authBy').value.trim();
    j.authorizedDate = document.getElementById('mfd_authDate').value;
  } else {
    j.authorizedBy=''; j.authorizedDate='';
  }
  // Sync location edits (and contact person) back to the reusable registry entry
  if(j.mifumoLocId){
    const loc = DB.mifumoLocations.find(l=>l.id===j.mifumoLocId);
    if(loc){
      if(j.location) loc.location = j.location;
      loc.contactName = document.getElementById('mfd_contactName').value.trim();
      loc.contactPhone = document.getElementById('mfd_contactPhone').value.trim();
    }
  }
  if(j.status==='imekamilika' && !j.completedAt) j.completedAt = nowTime();
  if(j.status==='inaendelea' && !j.startedAt) j.startedAt = nowTime();
  j.startDate = manualStartDate || j.startDate || (j.startedAt ? j.startedAt.slice(0,10) : null);
  j.completedDate = manualCompletedDate || j.completedDate || (j.completedAt ? j.completedAt.slice(0,10) : null);
  saveDB(); closeModal(); toast("Taarifa za kazi zimehifadhiwa","green");
  if(Number(j.totalCost||0)>0 && j.technicianIds.length===0 && j.assistantIds.length===0){
    toast("⚠ Hakuna fundi aliyechaguliwa kwa kazi hii — mapato yake hayataonekana kwenye Utendaji & Mafundi Bora mpaka umchague fundi.","red");
  }
  renderMifumo(document.getElementById('view_mifumo'));
}
function deleteMifumo(id){
  if(!requireDelete()) return;
  if(!confirm("Una uhakika unataka kufuta kazi hii?")) return;
  DB.mifumoJobs = DB.mifumoJobs.filter(j=>j.id!==id);
  DB.mifumoPayments = DB.mifumoPayments.filter(p=>p.jobId!==id);
  DB.feedback = DB.feedback.filter(f=>!(f.refType==='mifumo' && f.refId===id));
  DB.spareParts = DB.spareParts.filter(p=>!(p.jobRefType==='mifumo' && p.jobRefId===id));
  saveDB(); closeModal(); toast("Kazi imefutwa","green");
  renderMifumo(document.getElementById('view_mifumo'));
}

/* ============================== INVENTORY (Vipuri & Wazabuni) ============================== */
const INV_TOLERANCE_DAYS = 2;
const INV_STATUS_LABELS = {
  pending:  {label:"Inasubiriwa", cls:"gray"},
  overdue:  {label:"Imechelewa (>siku 2)", cls:"red"},
  received: {label:"Imefika Ghalani", cls:"blue"},
  issued:   {label:"Imetolewa kwa Fundi", cls:"green"},
  returned: {label:"Imerudishwa kwa Mzabuni", cls:"amber"}
};
function daysBetween(dateA, dateB){
  const a = new Date(dateA), b = new Date(dateB);
  return Math.floor((b - a) / (1000*60*60*24));
}
function invStatus(o){
  if(o.returnedQty && Number(o.returnedQty) >= Number(o.quantity||0)) return 'returned';
  if(o.issuedDate) return 'issued';
  if(o.receivedDate) return 'received';
  if(daysBetween(o.orderDate, todayISO()) > INV_TOLERANCE_DAYS) return 'overdue';
  return 'pending';
}
function invJobLabel(o){
  if(o.jobRefType==='vehicle'){ const v = vehicleById(o.jobRefId); return v ? `🚗 ${v.regNo}` : '—'; }
  if(o.jobRefType==='mifumo'){ const j = mifumoJobById(o.jobRefId); return j ? `${MIFUMO_TYPE_ICONS[j.jobType]||'⚡'} ${j.location}` : '—'; }
  return '—';
}
/** Current quantity on hand for a part name, computed live from the full order history — avoids any
 *  incremental counter drifting out of sync with reality. */
function currentStockFor(partName){
  const norm = (partName||'').trim().toUpperCase();
  if(!norm) return 0;
  let qty = 0;
  DB.spareParts.forEach(o=>{
    if((o.partName||'').trim().toUpperCase() !== norm) return;
    if(o.receivedDate) qty += Number(o.quantity||0);
    if(o.issuedDate) qty -= Number(o.quantity||0);
    qty -= Number(o.returnedQty||0);
  });
  return qty;
}
function findOrCreateStockLevel(partName){
  let s = DB.stockLevels.find(x=>x.partName.trim().toUpperCase()===partName.trim().toUpperCase());
  if(!s){ s = {id:uid('stk'), partName, minQty:0, createdAt:nowTime()}; DB.stockLevels.push(s); }
  return s;
}
function allTrackedPartNames(){
  const names = new Set();
  DB.spareParts.forEach(o=>{ if(o.partName) names.add(o.partName.trim()); });
  DB.stockLevels.forEach(s=>{ if(s.partName) names.add(s.partName.trim()); });
  return [...names].sort((a,b)=>a.localeCompare(b));
}
function lowStockItems(){
  return allTrackedPartNames().map(name=>{
    const level = DB.stockLevels.find(s=>s.partName.trim().toUpperCase()===name.toUpperCase());
    const minQty = level ? Number(level.minQty||0) : 0;
    const current = currentStockFor(name);
    return {partName:name, current, minQty};
  }).filter(x=>x.minQty>0 && x.current <= x.minQty);
}
function overdueOrders(){
  return DB.spareParts.filter(o=>invStatus(o)==='overdue');
}

let invFilter = { status:'all', q:'' };

  const overdue = overdueOrders();
  const lowStock = lowStockItems();

    if(invFilter.q){
      const q = invFilter.q.toLowerCase();
      if(!((o.partName||'').toLowerCase().includes(q) || (o.partNumber||'').toLowerCase().includes(q) || (o.make||'').toLowerCase().includes(q) || (o.model||'').toLowerCase().includes(q))) return false;
    }
    return true;
  }).slice().sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));

  el.innerHTML = `
  ${overdue.length>0 ? `

    <div style="font-weight:700;color:var(--red);margin-bottom:6px;">⚠️ Vipuri Vilivyochelewa (zaidi ya siku ${INV_TOLERANCE_DAYS} tangu kuagizwa, bado havijafika)</div>
    <div class="small">${overdue.map(o=>`${esc(o.partName)} (${invJobLabel(o)}, tarehe ya agizo: ${fmtDate(o.orderDate)})`).join(' · ')}</div>
  </div>` : ''}
  ${lowStock.length>0 ? `
  <div class="card-pad" style="background:#FCE3C355;border:1px solid var(--amber-soft);border-radius:10px;margin-bottom:16px;">
    <div style="font-weight:700;color:#9C5B0C;margin-bottom:6px;">📉 Vipuri Vinavyokaribia Kuisha (chini ya kiwango cha chini)</div>
    <div class="small">${lowStock.map(x=>`${esc(x.partName)}: zimebaki ${x.current} (kiwango cha chini ${x.minQty})`).join(' · ')}</div>
  </div>` : ''}

  <div class="grid grid-2" style="align-items:start;margin-bottom:16px;">
    <div class="card">
      <div class="card-head"><h3>🏢 Wazabuni Waliosajiliwa</h3>
        <button class="btn secondary sm" onclick="openSupplierForm()">+ Sajili Mzabuni</button></div>

      }).join('') || `<tr><td colspan="4" class="empty">Hakuna mzabuni bado</td></tr>`}</tbody></table></div>
    </div>
    <div class="card">
      <div class="card-head"><h3>📦 Kiwango cha Chini cha Vipuri (Stock Levels)</h3>
        <button class="btn secondary sm" onclick="openStockLevelForm()">+ Weka Kiwango</button></div>
      <div class="table-wrap"><table><thead><tr><th>Kifaa/Kipuri</th><th>Vilivyopo</th><th>Kiwango cha Chini</th></tr></thead>
      <tbody>${DB.stockLevels.map(s=>{ const cur=currentStockFor(s.partName); const low=s.minQty>0 && cur<=s.minQty;
        return `<tr><td>${esc(s.partName)}</td><td style="font-weight:700;${low?'color:var(--red);':''}">${cur}</td><td>${s.minQty} <button class="btn ghost sm" onclick="openStockLevelForm('${s.id}')">Hariri</button></td></tr>`;

    </div>
  </div>

  <div class="flex-between" style="margin-bottom:14px;">
    <div class="pill-tabs" style="margin-bottom:0;">
      ${['all',...Object.keys(INV_STATUS_LABELS)].map(s=>`<div class="pill-tab ${invFilter.status===s?'active':''}" onclick="invFilter.status='${s}';renderParts(document.getElementById('view_parts'))">${s==='all'?'Zote':INV_STATUS_LABELS[s].label}</div>`).join('')}

    <button class="btn amber" onclick="openInventoryOrderForm()">➕ Agiza Vipuri/Vifaa</button>
  </div>
  <div class="card card-pad" style="margin-bottom:16px;">
    <div class="field" style="margin-bottom:0;">
      <label>Tafuta kwa Jina la Kifaa/Kipuri / Part Number / Make/Brand / Modeli/Aina</label>
      <input type="text" value="${esc(invFilter.q)}" oninput="invFilter.q=this.value; renderParts(document.getElementById('view_parts'))">
    </div>

function supplierReturnsReportTable(){
  const bySupplier = {};
  DB.spareParts.forEach(o=>{
    if(!o.returnedQty || Number(o.returnedQty)<=0) return;
    const key = o.supplierId || '__none__';
    if(!bySupplier[key]) bySupplier[key] = {supplierId:o.supplierId, totalReturned:0, reasons:[]};
    bySupplier[key].totalReturned += Number(o.returnedQty);
    if(o.returnReason) bySupplier[key].reasons.push(o.returnReason);
  });
  const rows = Object.values(bySupplier).sort((a,b)=>b.totalReturned-a.totalReturned);
  return `<table><thead><tr><th>Mzabuni</th><th>Jumla Yaliyorudishwa</th><th>Sababu</th></tr></thead><tbody>
    ${rows.map(r=>{ const s=supplierById(r.supplierId); return `<tr><td>${s?esc(s.name):'Haijulikani'}</td><td style="font-weight:700;color:var(--red);">${r.totalReturned}</td><td class="small">${esc([...new Set(r.reasons)].join(', ')||'—')}</td></tr>`; }).join('') || `<tr><td colspan="3" class="empty">Hakuna marejesho bado</td></tr>`}
    </tbody></table>`;
}
function topReturnedPartsTable(){
  const byPart = {};
  DB.spareParts.forEach(o=>{
    if(!o.returnedQty || Number(o.returnedQty)<=0) return;
    const key = (o.partName||'—').trim();
    byPart[key] = (byPart[key]||0) + Number(o.returnedQty);
  });
  const rows = Object.entries(byPart).sort((a,b)=>b[1]-a[1]);
  return `<table><thead><tr><th>Kifaa/Kipuri</th><th>Jumla Yaliyorudishwa</th></tr></thead><tbody>
    ${rows.map(([name,qty])=>`<tr><td>${esc(name)}</td><td style="font-weight:700;color:var(--red);">${qty}</td></tr>`).join('') || `<tr><td colspan="2" class="empty">Hakuna marejesho bado</td></tr>`}
    </tbody></table>`;
}

function saveInventoryOrder(locked){
  const partName = document.getElementById('io_partName').value.trim();
  const quantity = Number(document.getElementById('io_quantity').value)||0;
  if(!partName || quantity<=0){ toast("Jaza jina la kipuri na kiasi","red"); return; }
  let jobRefType, jobRefId;
  if(locked){
    jobRefType = document.getElementById('io_jobRefType').value;
    jobRefId = document.getElementById('io_jobRefId').value;
  } else {
    jobRefType = document.getElementById('io_jobRefType').value;
    if(!jobRefType){ toast("Chagua kama vipuri hivi ni vya gari au vya MIFUMO","red"); return; }
    jobRefId = jobRefType==='vehicle' ? document.getElementById('io_jobRefId_vehicle').value : document.getElementById('io_jobRefId_mifumo').value;
    if(!jobRefId){ toast(jobRefType==='vehicle' ? "Chagua gari husika" : "Chagua kazi ya MIFUMO husika","red"); return; }
  }
  let supplierId = document.getElementById('io_supplier').value;
  if(supplierId==='__new__'){
    const sn = document.getElementById('io_newSupplierName').value.trim();
    if(!sn){ toast("Andika jina la mzabuni mpya","red"); return; }
    const sup = { id:uid('sup'), name:sn, phone:document.getElementById('io_newSupplierPhone').value.trim(), createdAt:nowTime() };
    DB.suppliers.push(sup); supplierId = sup.id;
  }
  DB.spareParts.push({
    id:uid('prt'), partName, partNumber:document.getElementById('io_partNumber').value.trim(),
    make:document.getElementById('io_make').value.trim(), model:document.getElementById('io_model').value.trim(),
    quantity, unitCost:Number(document.getElementById('io_unitCost').value)||0, supplierId: supplierId||null,
    jobRefType, jobRefId, vehicleId: jobRefType==='vehicle'?jobRefId:null,
    orderDate: document.getElementById('io_orderDate').value||todayISO(),
    receivedDate:null, receivedBy:'', issuedDate:null, issuedBy:'', issuedToStaffId:null,
    returnedQty:0, returnReason:'', returnDate:null, createdAt:nowTime()
  });
  saveDB(); closeModal(); toast("Kifaa/Kipuri kimeagizwa","green");
  if(locked && jobRefType==='vehicle') openVehicleDetail(jobRefId);
  else if(locked) openMifumoDetail(jobRefId);
  else renderParts(document.getElementById('view_parts'));
}

function fillRoleOptions(dept, selected){
  const sel = document.getElementById('st_role');
  const roles = rolesForDept(dept);
  const isCustomSelected = selected && !roles.includes(selected);
  sel.innerHTML = roles.map(r=>`<option value="${esc(r)}" ${selected===r?'selected':''}>${esc(r)}</option>`).join('')
    + `<option value="${CUSTOM_ROLE_OPTION}" ${isCustomSelected?'selected':''}>➕ Nyingine (Ongeza Wadhifa Mwenyewe)</option>`;
  toggleCustomRoleInput(sel.value);
  if(isCustomSelected){ document.getElementById('st_customRole').value = selected; }
  toggleManagerBudgetFields(sel.value);
}
function onStaffRoleChange(val){
  toggleCustomRoleInput(val);
  toggleManagerBudgetFields(val);
}
function toggleCustomRoleInput(val){
  const box = document.getElementById('st_customRoleBox');
  if(box) box.style.display = (val===CUSTOM_ROLE_OPTION) ? 'block' : 'none';
}
/** The Regional Manager's budget is entered as two scoped figures (vehicles / MIFUMO) instead of one lump
 *  sum, since his performance is measured separately per scope — everyone else keeps the single field. */
function toggleManagerBudgetFields(role){
  const isManager = isRegionalManagerRole(role);
  const normalBox = document.getElementById('st_normalBudgetBox');
  const managerBox = document.getElementById('st_managerBudgetBox');
  if(!normalBox || !managerBox) return;
  normalBox.style.display = isManager ? 'none' : 'block';
  managerBox.style.display = isManager ? 'block' : 'none';
  if(isManager) updateManagerTotalBudget();
}
function updateManagerTotalBudget(){
  const v = Number(document.getElementById('st_vehicleBudget').value)||0;
  const m = Number(document.getElementById('st_mifumoBudget').value)||0;
  document.getElementById('st_managerTotalPreview').innerHTML = `Jumla ya bajeti ya mwaka (Magari + MIFUMO): <b>${fmtMoney(v+m)}</b>`;
}
function saveStaff(id){
  if(id && !requireEdit()) return;
  const name = document.getElementById('st_name').value.trim();
  if(!name){ toast("Andika jina la mfanyakazi","red"); return; }
  const dept = document.getElementById('st_dept').value;
  let role = document.getElementById('st_role').value;
  if(role === CUSTOM_ROLE_OPTION){
    const customRole = document.getElementById('st_customRole').value.trim();
    if(!customRole){ toast("Andika jina la wadhifa mpya","red"); return; }
    role = customRole;
    addCustomRole(dept, role);
  }
  const isManager = isRegionalManagerRole(role);
  const vehicleBudget = isManager ? (Number(document.getElementById('st_vehicleBudget').value)||0) : 0;
  const mifumoBudget = isManager ? (Number(document.getElementById('st_mifumoBudget').value)||0) : 0;
  const data = {
    name, phone: document.getElementById('st_phone').value.trim(),
    employeeNumber: document.getElementById('st_empNo').value.trim(),
    nationalId: document.getElementById('st_nida').value.trim(),
    dob: document.getElementById('st_dob').value,
    dateEmployed: document.getElementById('st_dateEmployed').value,
    address: document.getElementById('st_address').value.trim(),
    emergencyContact: document.getElementById('st_emergency').value.trim(),
    lunchAllowanceDefault: Number(document.getElementById('st_lunchDefault').value)||0,
    transportAllowanceDefault: Number(document.getElementById('st_transportDefault').value)||0,
    dept, role,
    annualBudget: isManager ? (vehicleBudget+mifumoBudget) : (Number(document.getElementById('st_budget').value)||0),
    vehicleBudget, mifumoBudget
  };
  if(id){
    Object.assign(staffById(id), data);
  } else {
    DB.staff.push({id:uid('stf'), ...data, createdAt:nowTime()});
  }
  saveDB(); closeModal(); toast("Taarifa za mfanyakazi zimehifadhiwa","green");
  renderStaff(document.getElementById('view_staff'));
}
function deleteStaff(id){
  if(!requireDelete()) return;
  if(!confirm("Una uhakika unataka kufuta mfanyakazi huyu?")) return;
  DB.staff = DB.staff.filter(s=>s.id!==id); saveDB(); toast("Mfanyakazi amefutwa","green");
  renderStaff(document.getElementById('view_staff'));
}

function totalRevenueFor(range){
  const veh = DB.payments.filter(p=>inRange(p.date, range)).reduce((s,p)=>s+Number(p.amount||0),0);
  const mif = DB.mifumoPayments.filter(p=>inRange(p.date, range)).reduce((s,p)=>s+Number(p.amount||0),0);
  const park = DB.parkingFees.filter(p=>inRange(p.date, range)).reduce((s,p)=>s+Number(p.amount||0),0);
  return {veh, mif, park, total: veh+mif+park};
}
/** Jumla ya matumizi: matumizi ya moja kwa moja + posho + vitu vya workshop + vipuri vilivyonunuliwa. */
function totalExpenditureFor(range){
  const exp = DB.expenditures.filter(e=>inRange(e.date, range)).reduce((s,e)=>s+Number(e.amount||0),0);
  const alw = DB.allowances.filter(a=>inRange(a.date, range)).reduce((s,a)=>s+Number(a.amount||0),0);
  const cons = DB.consumables.filter(c=>inRange(c.date, range)).reduce((s,c)=>s+Number(c.cost||0),0);
  const parts = DB.spareParts.filter(p=>inRange(p.orderDate, range)).reduce((s,p)=>s+Number(p.unitCost||0)*Number(p.quantity||1),0);
  return {exp, alw, cons, parts, total: exp+alw+cons+parts};
}

/** KPI kwa mafundi (mafundi wa magari/MIFUMO/ukaguzi): kipimo cha msingi ni UZALISHAJI - idadi ya kazi
 *  walizokamilisha na mapato waliyochangia, kulinganisha na bajeti/lengo lao la mwaka.
 *  KPI kwa "supporting staff" (PS, Mgavi, Afisa Tawala n.k.) hawana "mapato" ya moja kwa moja - kwa hiyo
 *  tunapendekeza kupima kwa TATHMINI YA KILA MWEZI yenye vigezo vinne (kila kimoja alama 1-5):
 *    - Mahudhurio/Muda (Attendance & Punctuality)
 *    - Ubora wa Kazi (Quality of Work)
 *    - Nidhamu (Discipline)
 *    - Ushirikiano Timu (Teamwork)
 *  Wastani wa hizi nne ndio "KPI Score" ya mwezi kwa supporting staff. Mafundi wanaweza pia kupewa
 *  tathmini hii kama nyongeza ya kimaadili juu ya uzalishaji wao wa kifedha. */
function technicianProductivity(staffId){
  const vehJobs = DB.vehicles.filter(v=>(v.technicianIds||[]).includes(staffId) || (v.assistantIds||[]).includes(staffId));
  const vehDone = vehJobs.filter(v=>v.status==='imekamilika');
  const vehRevenue = vehJobs.reduce((s,v)=>s+vehiclePaidTotal(v.id),0);
  const mifJobs = DB.mifumoJobs.filter(j=>(j.technicianIds||[]).includes(staffId) || (j.assistantIds||[]).includes(staffId));
  const mifDone = mifJobs.filter(j=>j.status==='imekamilika');
  const mifRevenue = mifJobs.reduce((s,j)=>s+DB.mifumoPayments.filter(p=>p.jobId===j.id).reduce((a,p)=>a+Number(p.amount||0),0),0);
  const totalRevenue = vehRevenue + mifRevenue;
  const s = staffById(staffId);
  const target = s ? Number(s.annualBudget||0) : 0;
  const pct = target>0 ? Math.min(999, Math.round((totalRevenue/target)*100)) : null;
  return { vehTotal:vehJobs.length, vehDone:vehDone.length, mifTotal:mifJobs.length, mifDone:mifDone.length, totalRevenue, target, pct };
}

/* ============================== PERFORMANCE ============================== */
let perfRange = 'month';
let perfScope = 'all'; // 'all' | 'vehicles' | 'mifumo'
const PERF_SCOPE_LABELS = { all:'Vyote (Magari + MIFUMO)', vehicles:'Magari Tu', mifumo:'MIFUMO Tu' };
const RANGE_LABELS = {day:'Leo',week:'Wiki Hii',month:'Mwezi Huu',quarter:'Robo Mwaka',half:'Nusu Mwaka',year:'Mwaka wa Fedha'};
const RANGE_DIVISOR = {day:365, week:52, month:12, quarter:4, half:2, year:1}; // fraction of annual budget

/** All staff ids who touched a job (both technicians and assistants) — everyone counts as having worked. */
function jobParticipants(job){
  return [...(job.technicianIds||[]), ...(job.assistantIds||[])];
}
function computeStaffStats(range, scope){
  scope = scope || 'all';
  const techs = [...assignableStaff(), ...mifumoStaff()].filter(s=>s.role!=='Meneja wa Mkoa');
  return techs.map(s=>{
    let revenue=0, jobs=0;
    if(scope==='all' || scope==='vehicles'){
      DB.vehicles.forEach(v=>{
        const participants = jobParticipants(v);
        if(participants.includes(s.id)){
          const payAmt = DB.payments.filter(p=>p.vehicleId===v.id && inRange(p.date, range)).reduce((a,p)=>a+Number(p.amount||0),0);
          revenue += payAmt / participants.length; // split evenly across everyone who worked on it
          if(v.status==='imekamilika' && ((v.completedAt && inRange(v.completedAt.slice(0,10), range)) )) jobs++;
        }
      });
    }
    if(scope==='all' || scope==='mifumo'){
      DB.mifumoJobs.forEach(j=>{
        const participants = jobParticipants(j);
        if(participants.includes(s.id)){
          const payAmt = DB.mifumoPayments.filter(p=>p.jobId===j.id && inRange(p.date, range)).reduce((a,p)=>a+Number(p.amount||0),0);
          revenue += payAmt / participants.length;
          if(j.status==='imekamilika' && ((j.completedAt && inRange(j.completedAt.slice(0,10), range)) )) jobs++;
        }
      });
    }
    const budgetForPeriod = (s.annualBudget||0) / RANGE_DIVISOR[range];
    const pct = budgetForPeriod>0 ? Math.round((revenue/budgetForPeriod)*100) : null;
    return {staff:s, revenue, jobs, budgetForPeriod, pct};
  });
}

/** Total revenue and completed-job count across ALL of TEMESA's work (vehicles and/or MIFUMO) in a period —
 *  this is the basis for the Regional Manager's performance, since he oversees everything rather than
 *  personally doing individual jobs. */
function totalRevenueAndJobs(range, scope){
  scope = scope || 'all';
  let revenue=0, jobs=0;
  if(scope==='all' || scope==='vehicles'){
    DB.vehicles.forEach(v=>{
      revenue += DB.payments.filter(p=>p.vehicleId===v.id && inRange(p.date, range)).reduce((a,p)=>a+Number(p.amount||0),0);
      if(v.status==='imekamilika' && v.completedAt && inRange(v.completedAt.slice(0,10), range)) jobs++;
    });
  }
  if(scope==='all' || scope==='mifumo'){
    DB.mifumoJobs.forEach(j=>{
      revenue += DB.mifumoPayments.filter(p=>p.jobId===j.id && inRange(p.date, range)).reduce((a,p)=>a+Number(p.amount||0),0);
      if(j.status==='imekamilika' && j.completedAt && inRange(j.completedAt.slice(0,10), range)) jobs++;
    });
  }
  return {revenue, jobs};
}
/** The Regional Manager supervises all of TEMESA's work, so his performance is measured by the TOTAL money
 *  generated office-wide against his own period budget — total revenue ÷ budget for the period × 100.
 *  His budget is split by scope (Magari vs MIFUMO have separate annual budgets), so the correct budget
 *  slice must be picked to match whichever scope is currently selected. */
function computeRegionalManagerStats(range, scope, technicianStats){
  const manager = DB.staff.find(s=>isRegionalManagerRole(s.role) && s.active!==false);
  if(!manager) return null;
  const {revenue: totalRevenue, jobs: totalJobs} = totalRevenueAndJobs(range, scope);
  let annualBudgetForScope;
  if(scope==='vehicles') annualBudgetForScope = Number(manager.vehicleBudget||0);
  else if(scope==='mifumo') annualBudgetForScope = Number(manager.mifumoBudget||0);
  else annualBudgetForScope = Number(manager.vehicleBudget||0) + Number(manager.mifumoBudget||0) || Number(manager.annualBudget||0);
  const budgetForPeriod = annualBudgetForScope / RANGE_DIVISOR[range];
  const pct = budgetForPeriod>0 ? Math.round((totalRevenue/budgetForPeriod)*100) : null;
  const rank = 1 + technicianStats.filter(s=>s.revenue > totalRevenue).length;
  const totalCount = technicianStats.length + 1;
  return {staff:manager, totalJobs, totalRevenue, budgetForPeriod, pct, rank, totalCount};
}

/** Flags staff whose workload (job count) is high relative to their peers but whose revenue is disproportionately low. */
function computeWorkloadDisparity(stats){
  const withJobs = stats.filter(s=>s.jobs>0);
  if(withJobs.length===0) return [];
  const maxJobs = Math.max(...withJobs.map(s=>s.jobs));
  const maxRev = Math.max(...withJobs.map(s=>s.revenue), 1);
  return withJobs.map(s=>({...s, disparity: (s.jobs/maxJobs) - (s.revenue/maxRev)}))
    .sort((a,b)=>b.disparity-a.disparity);
}
/** Simple, actionable Kiswahili advice generated from a staff member's % of budget achieved. */
function performanceAdvice(pct){
  if(pct===null) return "Bado hajawekewa bajeti ya kupimwa utendaji wake.";
  if(pct < 30) return "Utendaji uko chini sana ya bajeti — anahitaji ufuatiliaji wa karibu na mafunzo zaidi.";
  if(pct < 60) return "Anahitaji kuongezewa kazi zaidi na kusimamiwa kwa karibu ili afikie bajeti yake.";
  return "Anaendelea vizuri lakini bado hajafikia bajeti — atiwe moyo aendelee.";
}

      return `<tr><td>${fmtDate(p.date)}</td><td class="mono">${v?esc(v.regNo):'—'}</td><td style="font-weight:700;">${fmtMoney(p.amount)}</td><td>${esc(p.note||'—')}</td></tr>`;
    }).join('') || `<tr><td colspan="4" class="empty">Hakuna malipo yaliyorekodiwa</td></tr>`}</tbody></table></div>
  </div>
  `;

  // build 6-month trend
  const labels = [], data = [];
  const now = new Date();
  for(let i=5;i>=0;i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    labels.push(d.toLocaleDateString('sw-TZ',{month:'short',year:'2-digit'}));
    const sum = DB.payments.filter(p=>{ const pd=new Date(p.date); return pd.getFullYear()===d.getFullYear() && pd.getMonth()===d.getMonth(); })
      .reduce((a,p)=>a+Number(p.amount||0),0);

  const ctx = document.getElementById('revChart');
  if(financeChart) financeChart.destroy();
  if(ctx && window.Chart){

      type:'bar',
      data:{ labels, datasets:[{label:'Mapato (TSh)', data, backgroundColor:'#E8871E', borderRadius:6}] },
      options:{ plugins:{legend:{display:false}}, scales:{ y:{ ticks:{ callback:v=>(v/1000)+'K' } } } }
    });
  }

function showJobContactInfo(refVal){
  const box = document.getElementById('fb_contactBox');
  if(!box) return;
  if(!refVal){ box.innerHTML=''; return; }
  const [refType, refId] = refVal.split(':');
  let name='', phone='';
  if(refType==='vehicle'){
    const v = vehicleById(refId);
    if(!v){ box.innerHTML=''; return; }
    name = v.driverName||''; phone = v.driverPhone||'';
  } else {
    const j = mifumoJobById(refId);
    if(!j){ box.innerHTML=''; return; }
    const loc = DB.mifumoLocations.find(l=>l.id===j.mifumoLocId);
    name = loc ? (loc.contactName||'') : ''; phone = loc ? (loc.contactPhone||'') : '';
  }
  if(!name && !phone){
    box.innerHTML = `<div class="small" style="margin-bottom:12px;color:var(--slate);">Hakuna jina/namba ya simu iliyosajiliwa kwa ${refType==='vehicle'?'dereva wa gari hili':'mtu wa kuwasiliana wa kazi hii'}.</div>`;
    return;
  }
  box.innerHTML = `<div class="card-pad" style="background:#EFF6FF;border:1px solid var(--line);border-radius:9px;margin-bottom:14px;">
    <div class="small" style="font-weight:700;color:var(--navy);margin-bottom:6px;">📞 ${refType==='vehicle'?'Dereva wa Gari':'Mtu wa Kuwasiliana'}</div>
    <div style="display:flex;gap:18px;flex-wrap:wrap;align-items:center;">
      <div class="small">Jina: <b>${esc(name||'—')}</b></div>
      <div class="small" style="display:flex;align-items:center;gap:6px;">Simu: <b>${esc(phone||'—')}</b> ${phone?`<button type="button" class="copybtn" onclick="navigator.clipboard.writeText('${esc(phone)}').then(()=>toast('Namba imenakiliwa: ${esc(phone)}','green'))">Nakili</button> <a href="tel:${esc(phone)}" class="copybtn" style="text-decoration:none;">Piga Simu</a>`:''}</div>
    </div>
  </div>`;
}
function showNextServiceInfo(refVal){
  const box = document.getElementById('fb_nextServiceBox');
  if(!box) return;
  if(!refVal){ box.innerHTML=''; return; }
  const [refType, refId] = refVal.split(':');
  if(refType!=='vehicle'){ box.innerHTML=''; return; }
  const v = vehicleById(refId);
  if(!v){ box.innerHTML = ''; return; }
  if(!v.nextServiceKm){
    box.innerHTML = `<div class="small" style="margin-bottom:12px;color:var(--slate);">Huduma ijayo ya gari hili bado haijawekwa.</div>`;
    return;
  }
  const remaining = v.nextServiceKm - v.currentKm;
  const overdue = remaining <= 0;
  box.innerHTML = `<div class="card-pad" style="background:${overdue?'#FBE0DC33':'#DEF3E433'};border:1px solid ${overdue?'var(--red-soft)':'var(--green-soft)'};border-radius:9px;margin-bottom:14px;">
    <div class="small" style="font-weight:700;color:${overdue?'var(--red)':'var(--green)'};">
      ${overdue ? '⚠ Huduma ijayo imechelewa!' : '🔧 Kumbusho la Huduma Ijayo'}
    </div>
    <div class="small" style="margin-top:4px;">
      Gari lipo km <b>${v.currentKm.toLocaleString()}</b>. Huduma ijayo ni kwenye km <b>${v.nextServiceKm.toLocaleString()}</b>
      ${overdue ? ` — <b style="color:var(--red);">limeshazidi kwa km ${Math.abs(remaining).toLocaleString()}</b>` : ` — <b>zimebaki km ${remaining.toLocaleString()}</b>`}.
      Mkumbushe dereva.
    </div>
  </div>`;
}
function saveFeedback(){
  const refVal = document.getElementById('fb_ref').value;
  const comment = document.getElementById('fb_comment').value.trim();
  if(!refVal || !comment){ toast("Chagua kazi na andika maoni","red"); return; }
  const [refType, refId] = refVal.split(':');
  DB.feedback.push({id:uid('fbk'), refType, refId, day:Number(document.getElementById('fb_day').value),
    date:document.getElementById('fb_date').value||todayISO(), comment, calledBy:document.getElementById('fb_ps').value.trim(), createdAt:nowTime()});
  saveDB(); toast("Maoni yamehifadhiwa","green");
  renderFeedback(document.getElementById('view_feedback'));
}
function printSection(viewId){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('print-active'));
  document.getElementById(viewId).classList.add('print-active');
  window.print();
}

/** Every shilling TEMESA Mwanza has collected, from every source — core vehicle work plus all auxiliary jobs. */
function getAllCollections(range){
  const vehiclePayments = DB.payments.filter(p=>inRange(p.date, range)).reduce((a,p)=>a+Number(p.amount||0),0);
  const valuationFees = DB.valuations.filter(v=>inRange(v.date, range)).reduce((a,v)=>a+Number(v.fee||0),0);
  const tradeTestFees = DB.tradeTests.filter(t=>inRange(t.date, range)).reduce((a,t)=>a+Number(t.fee||0),0);
  const parkingFees = DB.parkingFees.filter(p=>inRange(p.date, range)).reduce((a,p)=>a+Number(p.amount||0),0);
  const mifumoFees = DB.mifumoPayments.filter(p=>inRange(p.date, range)).reduce((a,p)=>a+Number(p.amount||0),0);
  return {
    vehiclePayments, valuationFees, tradeTestFees, parkingFees, mifumoFees,
    total: vehiclePayments + valuationFees + tradeTestFees + parkingFees + mifumoFees
  };
}

/** Ranks clients (vehicle owners) by total amount paid — for identifying the best and weakest-paying clients. */
function rankClients(){
  const byOwner = {};
  DB.vehicles.forEach(v=>{
    if(!byOwner[v.owner]) byOwner[v.owner] = {owner:v.owner, vehicles:0, billed:0, paid:0};
    byOwner[v.owner].vehicles++;
    byOwner[v.owner].billed += Number(v.totalCost||0);
  });
  DB.payments.forEach(p=>{
    const v = vehicleById(p.vehicleId);
    if(!v) return;
    if(!byOwner[v.owner]) byOwner[v.owner] = {owner:v.owner, vehicles:0, billed:0, paid:0};
    byOwner[v.owner].paid += Number(p.amount||0);
  });
  const list = Object.values(byOwner);
  const sorted = list.slice().sort((a,b)=>b.paid-a.paid);
  return { all: sorted, top3: sorted.slice(0,3), bottom3: sorted.slice(-3).reverse() };
}

function exportBackup(silent){
  const blob = new Blob([JSON.stringify(DB,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'temesa_mwanza_backup_'+todayISO()+(silent?('_'+Date.now()):'')+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
  if(!silent) toast("Nakala ya hifadhi imepakuliwa","green");
}
function triggerImport(){ document.getElementById('importFile').click(); }
function importBackup(evt){
  const file = evt.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const parsed = JSON.parse(e.target.result);
      if(!confirm("⚠️ HII ITAFUTA na kubadilisha taarifa ZOTE zilizopo sasa kwenye kompyuta hii na nakala uliyopakia. Kama unataka kuUNGANISHA (kuongeza) badala ya kubadilisha, funga hili na tumia kitufe cha '🔀 Unganisha Nakala' badala yake. Je, unataka kuendelea kubadilisha kila kitu?")) return;
      const d = defaultDB();
      for(const k in d){ if(parsed[k] !== undefined) d[k] = parsed[k]; }
      DB = migrateDB(d); saveDB(); toast("Data imeagizwa (imported) kikamilifu","green"); render();
    }catch(err){ toast("Faili si sahihi","red"); }
  };
  reader.readAsText(file);
}

/* ---------------------------- MERGE BACKUP (combine work from multiple computers, keeping everything) ---------------------------- */
function triggerMergeImport(){ document.getElementById('mergeFile').click(); }
function mergeImportBackup(evt){
  const file = evt.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const parsed = JSON.parse(e.target.result);
      const migrated = migrateDB((()=>{ const d=defaultDB(); for(const k in d){ if(parsed[k]!==undefined) d[k]=parsed[k]; } return d; })());
      const counts = mergeImportedDB(migrated);
      const totalAdded = Object.values(counts).reduce((a,b)=>a+b,0);
      if(totalAdded===0){
        toast("Hakuna rekodi mpya zilizopatikana — data hii tayari ipo au ni sawa na iliyopo","green");
      } else {
        const lines = Object.entries(counts).filter(([k,v])=>v>0).map(([k,v])=>`${MERGE_LABELS[k]||k}: +${v}`).join(' · ');
        openModal(`
          <div class="modal-head"><h3>✅ Uunganishaji Umekamilika</h3><button class="modal-x" onclick="closeModal()">✕</button></div>
          <div class="modal-body">
            <p>Jumla ya rekodi mpya zilizoongezwa: <b>${totalAdded}</b></p>
            <p class="small">${lines}</p>

  };

}
const MERGE_LABELS = {
  vehicles:"Kazi za Magari", staff:"Wafanyakazi", suppliers:"Wazabuni", spareParts:"Vipuri", payments:"Malipo ya Magari",
  consumables:"Vitu vya Workshop", feedback:"Maoni", valuations:"Uthamini", roadworthiness:"Roadworthiness",
  boardingOff:"Boarding Off", tradeTests:"Trade Test", parkingFees:"Ada za Parking", mifumoJobs:"Kazi za MIFUMO",
  mifumoPayments:"Malipo ya MIFUMO", vehicleRegistry:"Daftari la Magari", mifumoLocations:"Daftari la Maeneo ya MIFUMO",
  users:"Akaunti za Watumiaji"
};
/** Combines an imported database into the current one WITHOUT deleting anything — every record with a new id gets added,
 *  records that already exist (matched by id) are left as-is. Registry tables (vehicles, MIFUMO locations) are then
 *  de-duplicated by their natural key (registration no. / location name) so the same vehicle registered separately on
 *  two computers doesn't show up twice in the picker — any job records pointing at the removed duplicate are re-linked
 *  to the entry that was kept, so nothing breaks. */
function mergeImportedDB(imported){
  const arraysToUnion = ['vehicles','staff','suppliers','spareParts','payments','consumables','feedback',
    'valuations','roadworthiness','boardingOff','tradeTests','parkingFees','mifumoJobs','mifumoPayments',
    'vehicleRegistry','mifumoLocations','users','stockLevels'];
  const counts = {};
  arraysToUnion.forEach(key=>{
    if(!Array.isArray(imported[key])) return;
    DB[key] = DB[key] || [];
    const existingIds = new Set(DB[key].map(r=>r.id));
    let added = 0;
    imported[key].forEach(rec=>{
      if(rec && rec.id && !existingIds.has(rec.id)){
        DB[key].push(rec);
        existingIds.add(rec.id);
        added++;
      }
    });
    counts[key] = added;
  });
  if(imported.customRoles){
    DB.customRoles = DB.customRoles || {};
    Object.keys(imported.customRoles).forEach(dept=>{
      DB.customRoles[dept] = DB.customRoles[dept] || [];
      (imported.customRoles[dept]||[]).forEach(role=>{
        if(!DB.customRoles[dept].includes(role) && !(DEPT_ROLES[dept]||[]).includes(role)){
          DB.customRoles[dept].push(role);
        }
      });
    });
  }
  dedupeRegistry('vehicleRegistry', 'regNo', 'vehicles', 'vehicleRegId');
  dedupeRegistry('mifumoLocations', 'location', 'mifumoJobs', 'mifumoLocId');
  dedupeUsersByUsername();
  saveDB();
  return counts;
}
/** Keeps the earliest-created entry for each unique (case/space-insensitive) key value in a registry array,
 *  and re-points any job records that referenced a removed duplicate to the one that was kept. */
function dedupeRegistry(regArrKey, keyField, jobArrKey, jobFkField){
  const sorted = DB[regArrKey].slice().sort((a,b)=> new Date(a.createdAt||0)-new Date(b.createdAt||0));
  const seenKeyToId = new Map();
  const idRemap = new Map();
  const kept = [];
  sorted.forEach(rec=>{
    const norm = (rec[keyField]||'').trim().toUpperCase();
    if(!norm){ kept.push(rec); return; }
    if(seenKeyToId.has(norm)){
      idRemap.set(rec.id, seenKeyToId.get(norm));
    } else {
      seenKeyToId.set(norm, rec.id);
      kept.push(rec);
    }
  });
  DB[regArrKey] = kept;
  if(idRemap.size>0 && DB[jobArrKey]){
    DB[jobArrKey].forEach(job=>{
      if(job[jobFkField] && idRemap.has(job[jobFkField])) job[jobFkField] = idRemap.get(job[jobFkField]);
    });
  }
}
/** Keeps the earliest-created account for each username (case-insensitive) if a merge happened to bring in a duplicate. */
function dedupeUsersByUsername(){
  const sorted = DB.users.slice().sort((a,b)=> new Date(a.createdAt||0)-new Date(b.createdAt||0));
  const seen = new Set();
  const kept = [];
  sorted.forEach(u=>{
    const norm = (u.username||'').trim().toLowerCase();
    if(norm && seen.has(norm)) return; // drop the later duplicate
    if(norm) seen.add(norm);
    kept.push(u);
  });
  DB.users = kept;
}

function recalcValuation(){
  const b = Number(document.getElementById('v_cifTshs').value)||0;
  const c = Number(document.getElementById('v_depPercent').value)||0;
  const d = Math.round(b * c / 100);
  const e = b - d;
  document.getElementById('v_depAmount').value = d || '';
  document.getElementById('v_residual').value = b ? e : '';
}

function saveRoadworthiness(){
  const regNo = document.getElementById('rw_regNo').value.trim();
